<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="format-detection" content="telephone=no" />
<title>ARTPORTAL · 全球艺术机会</title>
<meta name="description" content="全球艺术机会索引:展览征集、驻留、奖项、招聘、资讯铺在可交互地球上,面向中国艺术家与艺术院校学生。真不真 · 急不急 · 给不给钱,一眼看清。" />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<meta property="og:type" content="website" />
<meta property="og:title" content="ARTPORTAL · 全球艺术机会" />
<meta property="og:description" content="为中国艺术家汇集全球展览征集、驻留、奖项、招聘、资讯,铺在可交互地球上。" />
<meta property="og:image" content="assets/hero.svg" />
<meta property="og:site_name" content="ARTPORTAL" />
<meta property="og:locale" content="zh_CN" />
<meta name="theme-color" content="#F7F6F2" />
<!-- 站点版本(SemVer,单一来源=根 VERSION;由 pipeline/bump-version.mjs 统一改写,勿手改) -->
<meta name="app-version" content="0.81.1" />
<style>
  :root{
    --bg:#F7F6F2; --ink:#1a1a1a; --sub:#6b6660; --muted:#a39e95; --line:#e5e2db; --panel:#ffffff;
    --opencall:#C0392B; --residency:#2E6FA7; --award:#C08A1E; --workshop:#6B5B95;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;color:var(--ink)}
  #gc{display:block;width:100vw;height:100vh;cursor:grab;touch-action:none}
  #gc:active{cursor:grabbing}
  #brand{position:fixed;left:26px;top:22px;pointer-events:none;z-index:5}
  #brand .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--opencall);margin-right:9px;vertical-align:middle}
  #brand h1{display:inline;font-size:16px;letter-spacing:.22em;font-weight:600;vertical-align:middle}
  #brand p{margin:7px 0 0 1px;font-size:12px;color:var(--sub)}
  #panel{position:fixed;left:26px;top:96px;width:290px;display:flex;flex-direction:column;gap:14px;z-index:5}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;
    box-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 24px rgba(0,0,0,.05)}
  .card .hd{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--sub);letter-spacing:.04em}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#2e8b57}
  .badge i{width:7px;height:7px;border-radius:50%;background:#2e8b57;display:inline-block}
  .bignum{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:8px 0 2px;line-height:1}
  .bignum small{font-size:13px;font-weight:500;color:var(--sub);margin-left:6px}
  .card .tip{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:8px}
  .search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:11px 14px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 24px rgba(0,0,0,.05)}
  .search input{border:0;outline:0;flex:1;font-size:13px;background:transparent;color:var(--ink)}
  .search .kbd{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
  .legend .lg-title{font-size:12px;color:var(--sub);margin-bottom:12px}
  .lg-item{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;cursor:pointer;border-radius:8px}
  .lg-item:hover{background:#faf9f5}
  .lg-item .sw{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .lg-item .nm{flex:1}
  .lg-item .ct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .lg-item.off{opacity:.38}
  /* 门类/快捷筛选 chips(横滑一行,老站筛选体系并入) */
  .tagrow{display:flex;gap:6px;overflow-x:auto;padding:7px 0 2px;margin-top:6px;border-top:1px dashed var(--line);
    scrollbar-width:none}
  .tagrow::-webkit-scrollbar{display:none}
  .tgc{font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--sub);
    cursor:pointer;white-space:nowrap;flex:0 0 auto;display:inline-flex;align-items:center;gap:5px}
  .tgc i{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
  .tgc.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  html.dark .tgc.on{background:#ece9e2;color:#141311}
  .lc-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .lc-sort{cursor:pointer;color:var(--muted);font-size:11px;white-space:nowrap}
  .lc-sort:hover{color:var(--sub)}
  .lang{font-size:12px;padding:6px 11px;border-radius:999px;cursor:pointer;color:var(--sub)}
  .lang:hover{background:#efeee8}
  #detail{position:fixed;right:26px;bottom:26px;width:368px;max-height:66vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.14);padding:16px 18px;display:none;z-index:7;overscroll-behavior:contain}
  #d-cover{width:100%;height:132px;object-fit:cover;border-radius:10px;margin-bottom:10px;display:block;background:#eceae2}
  #d-cover[hidden]{display:none}
  .badge2{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:5px;padding:1.5px 7px;vertical-align:1px;margin-left:6px}
  #detail .sub{font-size:11.5px;color:var(--muted);margin:-3px 0 8px;line-height:1.4}
  #detail .meta .r{display:flex;gap:8px;padding:3px 0;line-height:1.6}
  #detail .meta .k{color:var(--muted);flex:0 0 3em}
  html.en #detail .meta .k{flex:0 0 4.4em}
  #detail .meta .v{flex:1;min-width:0}
  #detail .cat{display:inline-block;font-size:11px;color:#fff;border-radius:5px;padding:2px 8px;margin-bottom:8px}
  #detail h3{margin:0 0 6px;font-size:15px;line-height:1.4}
  #detail .meta{font-size:12px;color:var(--sub);line-height:1.7}
  #detail .go{display:inline-block;margin-top:12px;font-size:12.5px;color:var(--opencall);text-decoration:none;font-weight:600}
  #detail .x{position:absolute;right:12px;top:10px;color:var(--muted);cursor:pointer;font-size:16px}
  /* 触屏无真实 hover:点按后 :hover 粘滞会让按钮一直挂着浅色底(暗色主题下变亮块),统一中和 */
  @media (hover:none){
    #chn .ch:hover,.lang:hover,.lg-item:hover,.oc:hover,.pp-row:hover,.uq-i:hover,.pp-up:hover{background:transparent}
    .abtn:hover,#back:hover,#btnPanel:hover,.pp-btn:hover,.pubgrid button:hover{background:var(--panel)}
    .oc.sel{background:#f1efe8}
    html.dark .oc.sel{background:#2b2823}
  }
  /* 关闭钮双形态:桌面=右上小叉(.xm),手机=左上 iOS 式「‹ 返回」(.xb) */
  .xm,.xb{font-style:normal}
  .xb{display:none;font-weight:500;letter-spacing:.02em}
  #back{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:6;display:none;background:var(--panel);
    border:1px solid var(--line);border-radius:999px;padding:9px 17px;font-size:13px;color:var(--ink);cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,.1)}
  #back:hover{background:#efeee8}
  #tip{position:fixed;pointer-events:none;z-index:20;display:none;width:300px;background:#fff;
    border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 34px rgba(0,0,0,.18);padding:0;overflow:hidden}
  #tip .timg{width:100%;height:156px;object-fit:cover;display:block;background:#eceae2}
  #tip .tph{width:100%;height:110px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:36px;font-weight:700}
  #tip .tpad{padding:11px 13px}
  #tip .ts{font-size:11.5px;color:var(--sub);line-height:1.6;margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
  html.dark #tip .timg{background:#2a2721}
  #tip .tt{font-size:13px;font-weight:600;line-height:1.35;margin:0 0 4px}
  #tip .tc{display:inline-block;font-size:10.5px;color:#fff;border-radius:4px;padding:1px 6px;margin-bottom:5px}
  #tip .tm{font-size:11.5px;color:var(--sub);line-height:1.65}
  #tip .tg{font-size:11px;color:var(--muted);margin-top:5px}
  #status{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);font-size:12px;color:var(--muted)}
  /* ===== 集成布局:站栏/页脚/切换(原有功能安放演示) ===== */
  /* 顶栏无底色,与界面融合(同原分类条效果);按钮自身仍是药丸型 */
  #sitebar{position:fixed;left:0;right:0;top:0;height:56px;z-index:9;display:flex;align-items:center;gap:18px;
    padding:0 22px;background:transparent}
  #sitebar .logo{display:flex;align-items:center;gap:9px;font-size:15px;letter-spacing:.2em;font-weight:600;white-space:nowrap}
  #sitebar .logo i{width:9px;height:9px;border-radius:50%;background:var(--opencall)}
  #chn{display:flex;gap:4px;margin-left:6px}
  #chn .ch{font-size:13.5px;padding:7px 14px;border-radius:999px;color:var(--sub);cursor:pointer;white-space:nowrap}
  #chn .ch:hover{background:#efeee8}
  #chn .ch.on{background:var(--ink);color:#fff}
  #sitebar .grow{flex:1}
  #sitebar .act{display:flex;align-items:center;gap:8px}
  .abtn{font-size:13px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;
    color:var(--ink);cursor:pointer;white-space:nowrap}
  .abtn:hover{background:#efeee8}
  .abtn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .abtn.icon{padding:7px 10px;position:relative}
  .abtn svg{vertical-align:-2.5px}
  .abtn .av{width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:-6px;margin:-3px 6px -3px -3px}
  .bdg{position:absolute;top:-3px;right:-3px;background:var(--opencall);color:#fff;font-style:normal;
    font-size:9px;line-height:1;border-radius:8px;padding:2px 4px;display:none}
  #brand{display:none}
  #panel{top:104px}
  #btnPanel{position:fixed;left:26px;top:64px;z-index:5;font-size:12px;padding:6px 13px;border-radius:999px;
    border:1px solid var(--line);background:var(--panel);color:var(--sub);cursor:pointer;
    box-shadow:0 1px 2px rgba(0,0,0,.04)}
  #btnPanel:hover{background:#efeee8}
  html.dark #btnPanel:hover{background:#262421}
  #foot{position:fixed;left:0;right:0;bottom:0;z-index:8;text-align:center;padding:7px 10px;
    font-size:11px;color:var(--muted);background:rgba(247,246,242,.82);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
  #foot a{color:var(--muted);text-decoration:none}
  #foot a:hover{color:var(--sub);text-decoration:underline}
  #back{bottom:44px}
  #detail{bottom:44px}
  #toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:30;background:var(--ink);color:#fff;
    font-size:12.5px;border-radius:999px;padding:9px 18px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .search .ai{font-size:11.5px;color:#fff;background:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap}
  /* 抽屉列表(Airbnb 式左栏,与地球双向联动) */
  #panel{top:104px;bottom:34px;width:330px}
  .listcard{flex:1;min-height:0;display:flex;flex-direction:column;padding:0;overflow:hidden}
  .lc-head{padding:13px 16px 9px;font-size:12px;color:var(--sub);border-bottom:1px solid var(--line)}
  .lc-scroll{overflow-y:auto;flex:1;padding:6px 8px 10px;overscroll-behavior:contain}
  .oc{display:flex;gap:10px;padding:10px;border-radius:10px;cursor:pointer;align-items:stretch}
  .oc:hover{background:#faf9f5}
  .oc.sel{background:#f1efe8}
  .oc .bar{width:4px;border-radius:3px;flex:0 0 auto}
  .oc .t{font-size:13px;font-weight:600;line-height:1.35}
  .oc .m{font-size:11.5px;color:var(--sub);margin-top:3px}
  html.dark .oc:hover{background:#242220}
  html.dark .oc.sel{background:#2b2823}
  /* 频道浮层:切频道不换页,地球虚化留在背后 */
  #chpanel{position:fixed;left:0;right:0;top:56px;bottom:26px;z-index:6;display:none;overflow-y:auto;
    background:rgba(247,246,242,.72);backdrop-filter:blur(7px)}
  #chpanel .inner{max-width:1080px;margin:14px auto;padding:0 16px}
  /* 频道浮层顶部筛选条(与全局同一份筛选状态) */
  #chpanel .chflt{margin-bottom:4px}
  #chpanel .tagrow{border-top:0;margin-top:2px;padding:5px 0 3px}
  /* 老站式卡片网格 */
  .ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px;margin-top:8px}
  .ocard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer}
  .ocard:hover{border-color:#c6c1b4}
  html.dark .ocard:hover{border-color:#4a453c}
  .oc-cov{position:relative;width:100%;aspect-ratio:16/9;background:#eceae2;overflow:hidden}
  html.dark .oc-cov{background:#2a2721}
  .oc-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;font-weight:700}
  .oc-cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .oc-cat{position:absolute;left:8px;top:8px;font-size:10.5px;color:#fff;border-radius:5px;padding:2px 8px;z-index:1}
  .oc-t{font-size:13.5px;font-weight:600;line-height:1.4;padding:9px 12px 3px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .oc-m{font-size:11.5px;color:var(--sub);padding:0 12px 10px;line-height:1.5}
  @media (max-width:720px){ .ogrid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px} }
  #chpanel .row{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
  #chpanel .row:hover{border-color:#c6c1b4}
  #chpanel .rt{font-size:14px;font-weight:600;line-height:1.45}
  #chpanel .rm{font-size:12px;color:var(--sub);margin-top:4px}
  html.dark #chpanel{background:rgba(20,19,17,.72)}
  html.dark #chpanel .row:hover{border-color:#4a453c}
  /* 配图:抽屉缩略图 + 频道行图 + 兜底海报块(老站三级兜底,永不空白) */
  .oc .th{width:56px;height:42px;border-radius:8px;flex:0 0 auto;overflow:hidden;position:relative;background:#eceae2}
  .oc .th img,#chpanel .rth img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .th .ph,.rth .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
  .oc .th .ph{font-size:15px}
  #chpanel .row{display:flex;gap:12px;align-items:center}
  #chpanel .rth{width:88px;height:60px;border-radius:8px;flex:0 0 auto;overflow:hidden;position:relative;background:#eceae2}
  #chpanel .rth .ph{font-size:18px}
  #chpanel .rbody{flex:1;min-width:0}
  html.dark .oc .th,html.dark #chpanel .rth{background:#2a2721}
  /* 作品网格(老站瀑布卡形态) */
  #chpanel .wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .wcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer}
  .wcard:hover{border-color:#c6c1b4}
  .wcard .wimg{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#eceae2}
  .wcard .wt{font-size:13px;font-weight:600;padding:9px 12px 2px;line-height:1.35}
  .wcard .wa{font-size:11.5px;color:var(--sub);padding:0 12px 10px}
  html.dark .wcard:hover{border-color:#4a453c}
  html.dark .wcard .wimg{background:#2a2721}
  #sheetbar{display:none}
  /* 夜间主题(与主站共享 localStorage.ap_theme) */
  html.dark{--bg:#141311;--ink:#ece9e2;--sub:#a49e93;--muted:#6f6a61;--line:#2c2925;--panel:#1d1b18}
  html.dark body{background:var(--bg)}
  html.dark #foot{background:rgba(20,19,17,.82)}
  html.dark .chip:hover,html.dark .abtn:hover,html.dark #chn .ch:hover,html.dark .lg-item:hover{background:#262421}
  html.dark .chip.on,html.dark #chn .ch.on{background:#ece9e2;color:#141311}
  html.dark .abtn{background:#1d1b18;color:var(--ink);border-color:var(--line)}
  html.dark .abtn.primary,html.dark .search .ai,html.dark #toast{background:#ece9e2;color:#141311;border-color:#ece9e2}
  html.dark #tip,html.dark #detail{background:#1d1b18}
  @media (max-width:720px){
    /* 顶栏压缩:去 logo、紧凑药丸、发布只留图标,保证一屏放得下 */
    /* 顶栏双行:第一行频道(可横滑),第二行操作钮靠右——彻底放得下 */
    #sitebar{flex-wrap:wrap;height:auto;padding:6px 8px 5px;gap:3px 6px}
    /* 双层:上=logo+操作钮(头像),下=频道横排 */
    #sitebar .logo{display:flex;font-size:12px;letter-spacing:.16em;gap:6px;order:1}
    #sitebar .logo span{display:none}
    #sitebar .grow{display:none}
    #sitebar .act{order:2;margin-left:auto;gap:5px}
    #chn{order:3;flex:1 1 100%;overflow-x:auto;margin-left:0;gap:2px}
    #chn .ch{font-size:12.5px;padding:6px 11px;flex:0 0 auto}
    .abtn{font-size:12px;padding:6px 9px}
    #pubTxt{display:none}
    #btnLogin span{display:none}
    .abtn .av{width:20px;height:20px;margin:-2px 0}
    .lang{padding:5px 8px;font-size:11.5px}
    #foot{font-size:10px;padding:5px 8px}
  }
  @media (max-width:720px){
    /* 底部抽屉:拖把手上滑展开列表,地球同步缩小(JS 联动) */
    /* 高度定死(top:15vh),位置全靠 transform 平移:合成器动画不触发重排,拖拽跟手;
       touch-action:none 防浏览器抢手势发 pointercancel(真机拖不动/卡顿的根源),列表区保留纵向滚动 */
    #panel{left:10px;right:10px;top:15vh;bottom:0;width:auto;gap:6px;
      background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;
      box-shadow:0 -8px 30px rgba(0,0,0,.12);padding:0 10px 8px;
      transform:translateY(59vh);will-change:transform;touch-action:none}
    #panel .lc-scroll{touch-action:pan-y}
    #panel input,#panel .ai{touch-action:auto}
    #sheetbar{display:flex;justify-content:center;padding:9px 0 3px;cursor:grab;touch-action:none;flex:0 0 auto}
    #sheetbar i{width:42px;height:4px;border-radius:2px;background:var(--line)}
    #panel .card{border:0;box-shadow:none;background:transparent;padding:6px 6px}
    /* AI 检索框:与抽屉底色拉开一档,一眼可见 */
    #panel .search{border:1px solid var(--line);box-shadow:none;background:#efede6;
      border-radius:12px;margin:0 4px;padding:8px 12px}
    html.dark #panel .search{background:#262320}
    .bignum{font-size:24px;margin:4px 0 0}
    .card .tip{display:none}
    /* 手机图例+筛选恢复:图例横向紧凑一行,门类/开关 chips 横滑 */
    .legend .lg-title{display:none}
    #legend{display:flex;overflow-x:auto;gap:2px;scrollbar-width:none}
    #legend::-webkit-scrollbar{display:none}
    #legend .lg-item{flex:0 0 auto;padding:4px 7px;font-size:11.5px;gap:5px}
    #legend .lg-item .ct{font-size:10.5px}
    .listcard{padding:0}
    #btnPanel{display:none}
    #brand{left:16px;top:14px}
    /* 点位详情卡:屏幕居中、尺寸收紧(不与顶栏/返回键错位) */
    #detail{left:22px;right:22px;width:auto;top:48%;bottom:auto;transform:translateY(-50%);
      max-height:56vh;padding-top:34px}
    #d-cover{height:104px}
    /* 返回键:压到双行顶栏安全距离之下,并抬高层级防被顶栏文字盖住点不到 */

      var isCN=(nm==='China'||nm==='Taiwan');                  // 台湾与大陆同色一体

      // 下钻国用明显的暖金高亮(浅色主题原先太淡="没有颜色"),邻国压暗;
      // 下钻中国而省界数据未就绪时,NE 兜底也用金色高亮(不再压暗成"没颜色")
      ctx.fillStyle=isCN?(cnDrilled?T.landSel:(drilledCountry?T.landDim:T.land)):(drilledCountry?(isSel?T.landSel:T.landDim):T.land); ctx.fill();
      ctx.lineWidth=isSel?1.2:0.45; ctx.strokeStyle=isSel?T.borderSel:T.border; ctx.stroke(); }
    // 下钻中国:DataV 官方省/市界(仅此时绘制,重度抽稀省算力)
    // 市级视图用细市多边形填充选中省(粗抽稀省面在高倍缩放下锯齿明显),粗省面只画未选中省
    var cnCityFill=(cnDrilled&&drillLevel>=2&&adminFeats.length>0);
    if(cnDrilled && cnBase && frontC(CN_CART)){
      for(var ci=0;ci<cnBase.length;ci++){ var pf=cnBase[ci];
        var provSel=(drillLevel>=2&&pf.properties.adcode===drilledProvAdcode);
        if(provSel&&cnCityFill) continue;
        ctx.beginPath(); pathC(pf);
        // 相邻区划交替双色调+加粗界线,每个行政区划肉眼可分
        ctx.fillStyle=(drillLevel>=2)?(provSel?T.landSel:T.landDim):((ci%2)?T.landSel:T.landSel2); ctx.fill();
        ctx.lineWidth=provSel?1.1:0.9; ctx.strokeStyle=provSel?T.borderSel:T.admin; ctx.stroke(); } }
    // 南海九段线(描边成线,非填充;中国可见时任何层级都画,合规标识)
    if(cnJD && frontC(CN_CART)){ ctx.lineWidth=1.3; ctx.strokeStyle=T.admin; ctx.beginPath(); pathC(cnJD); ctx.stroke(); }
    if(adminFeats.length){
      for(var a=0;a<adminFeats.length;a++){ var af=adminFeats[a];
        ctx.beginPath(); pathC(af);
        if(cnDrilled){   // 中国市级:细多边形交替填充(既有)
          if(cnCityFill){ ctx.fillStyle=(a%2)?T.landSel:T.landSel2; ctx.fill(); }
          ctx.lineWidth=0.8; ctx.strokeStyle=T.admin; ctx.stroke(); }
        else {           // 他国一级区划:交替双色调;二级视图=选中金/其余压暗
          var aSel=(drillLevel>=2&&af.properties&&af.properties.name===drilledAdmName);
          ctx.fillStyle=(drillLevel>=2)?(aSel?T.landSel:T.landDim):((a%2)?T.landSel:T.landSel2); ctx.fill();
          ctx.lineWidth=aSel?1.1:0.8; ctx.strokeStyle=aSel?T.borderSel:T.admin; ctx.stroke(); } } }
    // 国名(高档画质或静止时)
    // 地名门控:版图在屏幕上"装得下文字"才显示(小屏/缩小时自动少字,不再叠字)
    function fitsLabel(rRad,txt,fs2){
      var cjk=/[一-鿿]/.test(txt);
      return 2*rRad*sc > txt.length*fs2*(cjk?1:0.56)*1.12; }
    // —— 远景分层:最小=大洲名 → 稍放大=次区域名(两层均不画光标) → 再放大=国名+数字聚合点位 ——
    var MARKER_MIN=scale0*((W<=720)?1.6:0.95);
    var showMarkers=!!drilledCountry||sc>=MARKER_MIN;
    if(!drilledCountry && sc<MARKER_MIN && !((perfTier>=2&&inMotion())||sheetDrag)){
      var tierA=sc<scale0*((W<=720)?0.8:0.7);
      var regs=tierA?D.REGIONS.continents:D.REGIONS.subregions;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font=(tierA?'700 19px':'600 14px')+' "PingFang SC","Microsoft YaHei",sans-serif';
      for(var rg2=0;rg2<regs.length;rg2++){ var re2=regs[rg2];
        if(!re2.cart) re2.cart=ll2c(re2.ll);
        if(!frontC(re2.cart)) continue;
        var rp=proj(re2.ll), rtxt=(lang==='en')?re2.en:re2.zh;
        ctx.lineWidth=4; ctx.strokeStyle=T.halo; ctx.strokeText(rtxt,rp[0],rp[1]);
        ctx.fillStyle=T.label; ctx.fillText(rtxt,rp[0],rp[1]); } }
    if(showMarkers && sc>scale0*0.82 && !((perfTier>=2&&inMotion())||sheetDrag)){
      ctx.textAlign='center'; ctx.textBaseline='middle';
      for(var L=0;L<labelData.length;L++){ var d=labelData[L]; if(!frontC(d.cart)) continue;
        if(drilledCountry&&d.en===drilledCountry) continue;   // 下钻国不再标国名,让位区划名
        var fs=Math.max(9,Math.min(22,d.sz*(sc/scale0)));
        var lnm=(lang==='en')?d.en:d.nm;
        if(!fitsLabel(d.r,lnm,fs)) continue;
        var p=proj(d.c);
        ctx.font='600 '+fs+'px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.lineWidth=3; ctx.strokeStyle=T.halo; ctx.strokeText(lnm,p[0],p[1]);
        ctx.fillStyle=T.label; ctx.fillText(lnm,p[0],p[1]); } }
    // 行政区划地名:中国省级=省名、市级=市州名;他国=一级行政区名(同样按"装得下"门控)
    var AL=null;
    if(cnDrilled&&drillLevel===1) AL=provLabels;
    else if(drilledCountry&&adminLabels.length) AL=adminLabels;
    if(AL&&AL.length&&!((perfTier>=2&&inMotion())||sheetDrag)){
      ctx.textAlign='center'; ctx.textBaseline='middle';
      for(var A2=0;A2<AL.length;A2++){ var al=AL[A2]; if(!frontC(al.cart)) continue;
        // 中文界面优先用 name_zh(NE 自带官方中文州名);字号随区划屏上大小自适应(10–15px),装不下不标
        var atxt=(lang==='zh'&&al.zh)?al.zh:al.nm;
        var perCh=/[一-鿿]/.test(atxt)?1:0.56, availW=2*(al.r||0)*sc;
        if(availW < atxt.length*10*perCh*1.1) continue;
        var afs=Math.round(Math.min(15, availW*0.6/(atxt.length*perCh)));
        var ap=proj(al.c); if(ap[0]<-30||ap[0]>W+30||ap[1]<-20||ap[1]>H+20) continue;
        ctx.font='500 '+afs+'px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.lineWidth=3; ctx.strokeStyle=T.halo; ctx.strokeText(atxt,ap[0],ap[1]);
        ctx.fillStyle=T.label; ctx.fillText(atxt,ap[0],ap[1]); } }
    // 点位:远景层级隐藏;之后聚合簇 或 散点
    var m,mk,k,g;
    if(!showMarkers){
      for(m=0;m<markers.length;m++) markers[m].sx=null;
      for(k in groups) groups[k].sx=null;
    } else if(sc<splitScale()){
      for(m=0;m<markers.length;m++) markers[m].sx=null;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      for(k in groups){ g=groups[k];
        if(!frontC(g.cart)){ g.sx=null; continue; }
        var cnt=0, cc={opencall:0,residency:0,award:0,workshop:0}, single=null;
        for(var t=0;t<g.items.length;t++){ if(matchFilter(g.items[t].o)){ cnt++; cc[g.items[t].o.category]=(cc[g.items[t].o.category]||0)+1; single=g.items[t]; } }
        if(!cnt){ g.sx=null; continue; }
        var pt=proj(g.ll); g.sx=pt[0]; g.sy=pt[1]; g.count=cnt; g.single=(cnt===1)?single:null;
        var dom='opencall', dv=0; for(var c2 in cc){ if(cc[c2]>dv){ dv=cc[c2]; dom=c2; } }
        if(cnt===1){ g.r=(W<=720)?6:4;
          ctx.beginPath(); ctx.arc(pt[0],pt[1],g.r,0,2*PI);
          ctx.fillStyle=CAT[single.o.category]?CAT[single.o.category].color:'#C0392B'; ctx.fill();
          ctx.lineWidth=1.2; ctx.strokeStyle=T.mstroke; ctx.stroke(); }
        else { var r=((W<=720)?10:8)+Math.min(9,Math.sqrt(cnt)*1.7); g.r=r;
          ctx.beginPath(); ctx.arc(pt[0],pt[1],r,0,2*PI);
          ctx.fillStyle=CAT[dom].color; ctx.fill();
          ctx.lineWidth=1.5; ctx.strokeStyle=T.mstroke; ctx.stroke();
          ctx.font='600 '+(cnt>=100?10:11)+'px -apple-system,sans-serif';
          ctx.fillStyle='#fff'; ctx.fillText(String(cnt),pt[0],pt[1]); }
        if(g.key===focusKey){ ctx.beginPath(); ctx.arc(pt[0],pt[1],g.r+4,0,2*PI);
          ctx.lineWidth=2; ctx.strokeStyle=CAT[dom].color; ctx.stroke(); } }
    } else {
      for(k in groups) groups[k].sx=null;
      var mr=(W<=720)?5.5:4;   // 手机散点加大,好点
      for(m=0;m<markers.length;m++){ mk=markers[m];
        if(!matchFilter(mk.o) || !frontC(mk.cart)){ mk.sx=null; continue; }
        var pt2=proj(mk.ll); mk.sx=pt2[0]; mk.sy=pt2[1];
        ctx.beginPath(); ctx.arc(pt2[0],pt2[1],mr,0,2*PI);
        ctx.fillStyle=CAT[mk.o.category]?CAT[mk.o.category].color:'#C0392B'; ctx.fill();
        ctx.lineWidth=1.2; ctx.strokeStyle=T.mstroke; ctx.stroke();
        if(mk===focusMk){ ctx.beginPath(); ctx.arc(pt2[0],pt2[1],9,0,2*PI);
          ctx.lineWidth=2; ctx.strokeStyle=CAT[mk.o.category]?CAT[mk.o.category].color:'#C0392B'; ctx.stroke(); } }
    }
    // FPS 守卫:近30帧均值超预算自动降档
    var cost=performance.now()-t0; costArr.push(cost);
    if(costArr.length>=30){ var sum=0; for(var q2=0;q2<costArr.length;q2++) sum+=costArr[q2];
      var avg=sum/costArr.length; costArr.length=0;
      if(avg>26&&perfTier===0){ perfTier=1; if(dpr>1){ dpr=1; sizeCanvas(); } }
      else if(avg>26&&perfTier===1){ perfTier=2; } }
  }

  // —— 主循环:自动旋转/惯性/平滑缩放,统一在这里驱动 ——
  var lastFrame=Date.now();
  (function loop(){ requestAnimationFrame(loop);
    if(!inited) return;   // 首次 resize 前不画(防脚本评估中途触发首帧)
    var now=Date.now(), render=needDraw; needDraw=false;
    if(targetScale!=null){ var s=proj.scale(), dd=targetScale-s;
      if(Math.abs(dd)>0.5){ proj.scale(s+dd*0.22); render=true; }
      else { proj.scale(targetScale); targetScale=null; render=true; } }
    if(inertiaOn){ var r=proj.rotate();
      proj.rotate([r[0]+velX, clampLat(r[1]+velY), r[2]]);
      velX*=0.95; velY*=0.95; render=true;
      if(Math.abs(velX)+Math.abs(velY)<0.02){ inertiaOn=false; resumeSoon(); } }
    else if(spinning&&!dragging){ var r2=proj.rotate();
      proj.rotate([r2[0]+(now-lastFrame)*0.004, r2[1], r2[2]]); render=true; }
    else if(!spinning&&!dragging&&autoResumeAt&&now>autoResumeAt&&!drilledCountry&&targetScale==null){ spinning=true; autoResumeAt=0; }
    lastFrame=now;
    if(render) draw();
  })();
  function resumeSoon(){ if(!drilledCountry) autoResumeAt=Date.now()+3000; }

  // —— 指针交互:鼠标+触控统一(单指拖转/双指捏合/惯性) ——
  var pointers={}, pinch=null, lastX=0,lastY=0,lastT=0;
  function pCount(){ var n=0,k; for(k in pointers) n++; return n; }
  canvas.addEventListener('pointerdown',function(e){
    if(canvas.setPointerCapture){ try{ canvas.setPointerCapture(e.pointerId); }catch(err){} }
    pointers[e.pointerId]=[e.clientX,e.clientY];
    spinning=false; inertiaOn=false;
    var n=pCount();
    if(n===1){ dragging=true; moved=false; lastX=e.clientX; lastY=e.clientY; lastT=performance.now(); velX=velY=0; }
    else if(n===2){ dragging=false; var ks=Object.keys(pointers), a=pointers[ks[0]], b=pointers[ks[1]];
      pinch={d0:Math.max(20,Math.hypot(a[0]-b[0],a[1]-b[1])), s0:proj.scale()}; }
    e.preventDefault();
  });
  canvas.addEventListener('pointermove',function(e){
    if(pointers[e.pointerId]) pointers[e.pointerId]=[e.clientX,e.clientY];
    if(pinch&&pCount()>=2){ var ks=Object.keys(pointers), a=pointers[ks[0]], b=pointers[ks[1]];
      var dd=Math.hypot(a[0]-b[0],a[1]-b[1]);
      targetScale=clampScale(pinch.s0*dd/pinch.d0); e.preventDefault(); return; }
    if(dragging){
      var now=performance.now(), dx=e.clientX-lastX, dy=e.clientY-lastY;
      if(Math.abs(dx)+Math.abs(dy)>2) moved=true;
      var kk=70/proj.scale(), r=proj.rotate();
      proj.rotate([r[0]+dx*kk, clampLat(r[1]-dy*kk), r[2]]);
      var dt=Math.max(1,now-lastT), nvx=dx*kk*(16.7/dt), nvy=-dy*kk*(16.7/dt);
      velX=velX*0.4+nvx*0.6; velY=velY*0.4+nvy*0.6;   // 平滑速度采样→松手惯性
      lastX=e.clientX; lastY=e.clientY; lastT=now;
      tipEl.style.display='none'; needDraw=true; e.preventDefault(); return; }
    if(e.pointerType==='mouse') hoverTest(e);
  });
  function endPointer(e){ delete pointers[e.pointerId];
    if(pCount()<2) pinch=null;
    if(pCount()===0&&dragging){ dragging=false;
      if((performance.now()-lastT)<120 && (Math.abs(velX)+Math.abs(velY))>0.03) inertiaOn=true;
      else resumeSoon(); } }
  canvas.addEventListener('pointerup',endPointer);
  canvas.addEventListener('pointercancel',endPointer);
  canvas.addEventListener('wheel',function(e){ e.preventDefault(); spinning=false;
    var base=(targetScale!=null)?targetScale:proj.scale();
    targetScale=clampScale(base*(e.deltaY<0?1.16:0.86)); resumeSoon(); },{passive:false});

  // —— 命中检测(簇优先于散点,按当前模式) ——
  function hoverTest(e){
    var sc=proj.scale(), best=null, kind=null, k, g, m, mk;
    if(sc<splitScale()){ var bd=1e9, slop=(W<=720)?9:5;
      for(k in groups){ g=groups[k]; if(g.sx==null) continue;
        var dx=g.sx-e.clientX, dy=g.sy-e.clientY, rr=(g.r+slop)*(g.r+slop), dd=dx*dx+dy*dy;
        if(dd<rr&&dd<bd){ bd=dd; best=g; kind='c'; } } }
    else { var bd2=(W<=720)?289:121;
      for(m=0;m<markers.length;m++){ mk=markers[m]; if(mk.sx==null) continue;
        var dx2=mk.sx-e.clientX, dy2=mk.sy-e.clientY, dd2=dx2*dx2+dy2*dy2;
        if(dd2<bd2){ bd2=dd2; best=mk; kind='m'; } } }
    if(best){ canvas.style.cursor='pointer';
      if(best!==hoverObj){ if(kind==='c'){ if(best.count===1) fillTip(best.single); else fillTipCluster(best); } else fillTip(best); }
      moveTip(e); tipEl.style.display='block'; }
    else { canvas.style.cursor='grab'; tipEl.style.display='none'; }
    hoverObj=best; hoverKind=kind;
  }
  canvas.addEventListener('click',function(e){
    if(moved) return;
    hoverTest(e);
    if(W<=720) tipEl.style.display='none';   // 手机:不弹悬浮卡,只居中弹详情卡(避免一次弹两个)
    if(W<=720&&drillLevel<2) hoverObj=null;  // 手机:进入最小行政区划(二级视图)前点位不可交互,点击只作用于区划(防误触)
    if(hoverObj){
      if(hoverKind==='c'){ var g=hoverObj;
        // 手机:聚合圆(含单条)一律放大不弹卡——拆分成散点后点位才可交互
        if(g.count===1&&W>720){ showDetail(g.single.o); syncCard(g.single); }
        else { tipEl.style.display='none'; flyTo(g.ll, Math.max(splitScale()*1.45, proj.scale()*1.9)); } }
      else { showDetail(hoverObj.o); syncCard(hoverObj); }
      return; }
    var inv=proj.invert([e.clientX,e.clientY]); if(!inv) return;
    if(drillLevel===2){   // 二级视图:点选中区划以外(邻区/境外/太空)→ 退回上一级并收卡
      var cur=null;
      if(drilledCountry==='China'){
        for(var cp=0;cp<(cnBase||[]).length;cp++){ if(cnBase[cp].properties.adcode===drilledProvAdcode){ cur=cnBase[cp]; break; } } }
      else { for(var ca=0;ca<adminFeats.length;ca++){ if(adminFeats[ca].properties&&adminFeats[ca].properties.name===drilledAdmName){ cur=adminFeats[ca]; break; } } }
      if(!cur||!d3.geoContains(cur,inv)) exitDrill();
      return; }
    if(drilledCountry==='China' && drillLevel===1 && cnBase){   // 省级视图:点省→下钻市级;点境外→回全球
      for(var cj=0;cj<cnBase.length;cj++){ if(d3.geoContains(cnBase[cj],inv)){ drillProvince(cnBase[cj]); return; } }
      if(drilledFeat&&d3.geoContains(drilledFeat,inv)) return;   // 省界抽稀缝隙内不误退
      exitDrill(); return; }
    if(drilledCountry && drillLevel===1){   // 他国:点州/省→二级视图;点国境外→回全球
      for(var aj=0;aj<adminFeats.length;aj++){ if(d3.geoContains(adminFeats[aj],inv)){ drillAdm1(adminFeats[aj]); return; } }
      if(drilledFeat&&d3.geoContains(drilledFeat,inv)) return;
      exitDrill(); return; }
    if(drillLevel===0){
      for(var i=0;i<countryFeats.length;i++){ if(d3.geoContains(countryFeats[i],inv)){ drillInto(countryFeats[i]); return; } } }
  });

  function flyTo(centroid,ts){ spinning=false; inertiaOn=false; targetScale=null;
    var r0=proj.rotate(), s0=proj.scale();
    d3.transition().duration(900).tween('fly',function(){
      var ir=d3.interpolate(r0,[-centroid[0],-centroid[1],0]), is=d3.interpolate(s0,clampScale(ts));
      return function(t){ proj.rotate(ir(t)).scale(is(t)); needDraw=true; }; }); }

  // —— 国家下钻:行政区划(加载时抽稀,渲染恒轻) ——
  var adminCache={};
  function decimateFC(fc,step){
    function ring(r,st){ if(r.length<=10) return r; var out=[],i=0;
      for(i=0;i<r.length;i+=st) out.push(r[i]);
      if(out[out.length-1]!==r[r.length-1]) out.push(r[r.length-1]); return out; }
    var fs=(fc.features||[]).map(function(f){ var gm=f.geometry; if(!gm) return f;
      // 按面积自适应:京津沪港澳等小区划不抽稀(重度抽稀会让它们显示畸形/点不中)
      var ar=0; try{ ar=d3.geoArea(f); }catch(e2){}
      var st=(ar>0&&ar<0.0008)?1:((ar>0&&ar<0.004)?Math.min(2,step):step);
      if(gm.type==='Polygon') gm={type:'Polygon',coordinates:gm.coordinates.map(function(r){return ring(r,st);})};
      else if(gm.type==='MultiPolygon') gm={type:'MultiPolygon',coordinates:gm.coordinates.map(function(pg){return pg.map(function(r){return ring(r,st);});})};
      return {type:'Feature',properties:f.properties,geometry:gm}; });
    return fs; }
  // DataV 的 GeoJSON 按平面惯例绕环,d3 球面填充会解释成"全球减去该区域"(整屏涂成地块色,
  // geoContains 同步失灵);载入时按球面面积重定绕向:外环<2π、内环孔>2π。幂等,可重复调用
  function rewindFC(fc){
    function area(r){ return d3.geoArea({type:'Polygon',coordinates:[r]}); }
    function fix(rings){ if(area(rings[0])>2*PI) rings[0].reverse();
      for(var i=1;i<rings.length;i++){ if(area(rings[i])<2*PI) rings[i].reverse(); } }
    (fc.features||[]).forEach(function(f){ var g=f.geometry; if(!g) return;
      if(g.type==='Polygon') fix(g.coordinates);
      else if(g.type==='MultiPolygon') g.coordinates.forEach(fix); });
    return fc; }
  // 中国区划数据(高德系,DataV GeoAtlas 镜像)已全部自托管在 data/geo/cn/,
  // 本地优先、阿里远端兜底、失败循环重试——不再因外部接口抽风丢省界
  var CN_LOCAL='data/geo/cn/';
  var CN_REMOTE='https://geo.datav.aliyun.com/areas_v3/bound/';
  var CN_URLS=[CN_LOCAL+'100000_full.json', CN_REMOTE+'100000_full.json'];
  function loadCN(i,cycle){
    if(cnBase) return;
    if(i>=CN_URLS.length){ if(cycle<5) setTimeout(function(){ loadCN(0,cycle+1); },6000); return; }
    d3.json(CN_URLS[i]).then(function(j){ if(cnBase) return;
      var provs=[], jd=null; rewindFC(j);
      (j.features||[]).forEach(function(f){ if(String(f.properties.adcode).indexOf('_JD')>=0) jd=f;
        else if(f.properties.name) provs.push(f); });
      cnProv=provs; cnBase=decimateFC({features:provs},8);   // 下钻才用,重度抽稀(小区划自适应保真)
      rewindFC({features:cnBase});   // 抽稀后重绕(防跨经线/临界环被抽翻)
      provLabels=cnBase.map(function(f){ var pr=f.properties, c=pr.center||d3.geoCentroid(f);
        return {c:c,cart:ll2c(c),nm:shortName(pr.name),r:Math.sqrt(d3.geoArea(f)/Math.PI)}; });
      if(jd) cnJD=jd;   // 九段线不抽稀(段小,抽稀会破坏),描边渲染
      adminCache[CN_URLS[0]]=j; needDraw=true; })
    .catch(function(){ loadCN(i+1,cycle); }); }
  // 区划短名:去"省/市/自治区/自治州/特别行政区"等后缀,标注更清爽
  function shortName(nm){ nm=String(nm||'');
    var s=nm.replace(/(维吾尔|壮族|回族)?自治区$|特别行政区$|(蒙古族|蒙古|朝鲜族|土家族|布依族|哈尼族|傈僳族|景颇族|柯尔克孜族|柯尔克孜|哈萨克族|哈萨克|维吾尔族|回族|藏族|彝族|傣族|白族|苗族|侗族|壮族|羌族|满族|瑶族|黎族|畲族|仡佬族|仫佬族|毛南族|各族){0,3}自治[州县旗]$|(地区|林区|新区|盟|省|市|县|区)$/,'');
    return s||nm; }
  // 视野自适应:目标区域铺满屏(四周留 6% 余量);maxK 同步放宽让滚轮不被旧上限拽回
  function fitScaleFor(feat,cen){
    var pad=Math.round(Math.min(W,H)*0.06);
    var p2=d3.geoOrthographic().clipAngle(90).rotate([-cen[0],-cen[1],0]);
    try{ p2.fitExtent([[pad,pad],[W-pad,H-pad]],feat); }catch(e2){ return null; }
    var s=p2.scale(); return (isFinite(s)&&s>0)?Math.min(s,scale0*120):null; }
  function fitFly(feat,cen,fallback){
    var ts=(feat&&fitScaleFor(feat,cen))||fallback;
    maxK=Math.max(9, ts/scale0*1.6);
    flyTo(cen,ts); }
  // 视野中心用边界盒中点(DataV properties.center 是省会/驻地坐标,偏一角会把区域挤出屏)
  function boundsCenter(feat){ var b=d3.geoBounds(feat), lo=b[0][0], hi=b[1][0];
    if(hi<lo) hi+=360;   // 跨 180° 经线(俄罗斯等)
    var lon=(lo+hi)/2; if(lon>180) lon-=360;
    return [lon,(b[0][1]+b[1][1])/2]; }
  // 他国一级区划(州/省/府/邦)同样自托管:data/geo/world/<国名slug>.json(NE 10m 切分),
  // 远端 NE 50m 仅作最后兜底(只覆盖少数大国)
  function admSlug(nm){ return String(nm).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
  function drillInto(feat){ var nm=feat.properties.name;
    if(nm==='China'||nm==='Taiwan'){ drillChina(); return; }
    drilledCountry=nm; drilledFeat=feat; drillLevel=1; drilledProvAdcode=null; drilledAdmName=null; adminFeats=[]; adminLabels=[];
    fitFly(feat, boundsCenter(feat), scale0*2.9);
    var bk=document.getElementById('back'); bk.style.display='block'; bk.textContent=L('backW'); ensureGuard();
    loadAdmin('data/geo/world/'+admSlug(nm)+'.json',null,2,
      'https://cdn.jsdelivr.net/gh/martynafford/natural-earth-geojson@master/50m/cultural/ne_50m_admin_1_states_provinces.json',nm); }
  function drillAdm1(f){ drillLevel=2; drilledAdmName=f.properties.name;
    document.getElementById('back').textContent=L('backU');
    fitFly(f, boundsCenter(f), scale0*5); }
  function drillChina(){ drilledCountry='China'; drilledFeat=cnNE; drillLevel=1; drilledProvAdcode=null; adminFeats=[]; adminLabels=[];
    var bk=document.getElementById('back'); bk.style.display='block'; bk.textContent=L('backW'); ensureGuard();
    fitFly(cnNE,[104,35.5],scale0*2.7); needDraw=true; }   // 省界来自 cnBase(启动已载),无需再请求
  function drillProvince(pf){ var ad=pf.properties.adcode; if(!ad) return;
    drillLevel=2; drilledProvAdcode=ad;
    document.getElementById('back').textContent=L('backU');
    fitFly(pf, boundsCenter(pf), scale0*5.2);
    loadAdmin(CN_LOCAL+ad+'_full.json',null,2,CN_REMOTE+ad+'_full.json'); }
  function loadAdmin(url,filt,step,fbUrl,fbFilt){
    var seq=++adminSeq;   // 快速连点/中途退出时丢弃过期结果
    var p=adminCache[url]?Promise.resolve(adminCache[url]):d3.json(url).then(function(j){ rewindFC(j); adminCache[url]=j; return j; });
    p.then(function(j){ if(seq!==adminSeq) return;
      var fs=decimateFC(j,step||2);
      rewindFC({features:fs});   // 抽稀可能把跨180°经线的环(阿拉斯加等)再次抽翻,抽完必须重绕
      if(filt) fs=fs.filter(function(f){ return f.properties&&f.properties.admin===filt; });
      adminFeats=fs;
      adminLabels=fs.map(function(f){ var pr=f.properties||{};
        var c=pr.center||((typeof pr.longitude==='number'&&typeof pr.latitude==='number')?[pr.longitude,pr.latitude]:d3.geoCentroid(f));
        var nm=shortName(pr.name||'');
        return nm?{c:c,cart:ll2c(c),nm:nm,zh:(pr.name_zh?shortName(pr.name_zh):null),
          r:Math.sqrt(d3.geoArea(f)/Math.PI)}:null; }).filter(Boolean);
      needDraw=true; })
     .catch(function(){ if(seq!==adminSeq) return;
       if(fbUrl){ loadAdmin(fbUrl,(fbFilt!==undefined)?fbFilt:filt,step); return; }   // 本地缺失/失败 → 远端兜底
       adminFeats=[]; adminLabels=[]; needDraw=true; }); }
  function exitDrill(){
    // 逐级退出时收起点开的项目卡与悬浮层
    document.getElementById('detail').style.display='none'; tipEl.style.display='none';
    adminSeq++;   // 使在途 loadAdmin 结果作废
    if(drillLevel===2){
      document.getElementById('back').textContent=L('backW');
      if(drilledCountry==='China'){   // 市级 → 退回省级
        drillLevel=1; drilledProvAdcode=null; adminFeats=[]; adminLabels=[];
        fitFly(cnNE,[104,35.5],scale0*2.7); needDraw=true; return; }
      drillLevel=1; drilledAdmName=null;   // 他国二级 → 退回国家视图(区划保留)
      if(drilledFeat) fitFly(drilledFeat, boundsCenter(drilledFeat), scale0*2.9);
      needDraw=true; return; }
    drilledCountry=null; drilledFeat=null; drillLevel=0; adminFeats=[]; adminLabels=[]; drilledProvAdcode=null; drilledAdmName=null; maxK=9;
    document.getElementById('back').style.display='none';
    spinning=false; inertiaOn=false;
    var r0=proj.rotate(), s0=proj.scale();
    d3.transition().duration(800).tween('back',function(){
      var ir=d3.interpolate(r0,[-100,-30,0]), is=d3.interpolate(s0,scale0);
      return function(t){ proj.rotate(ir(t)).scale(is(t)); needDraw=true; }; });
    autoResumeAt=Date.now()+2000; releaseGuard(); }
  document.getElementById('back').addEventListener('click',exitDrill);

  // —— 信息层 ——
  function daysLeft(dl){ if(!dl) return ''; var d=new Date(dl+'T23:59:59'); if(isNaN(d)) return '';
    var n=Math.ceil((d-Date.now())/86400000);
    return n<0?L('dlOver'):(n===0?L('dlToday'):L('dlLeft')(n)); }
  function trustLabel(o){
    if(o.trust==='user') return L('tUser');
    if(o.trust==='verified') return L('tVer');
    if(o._via==='search') return L('tAI');
    return L('tAuto'); }
  // 结构化字段 → 人话(对齐主站 format.js 口径)
  function curSym(c){ return {CNY:'¥',USD:'$',EUR:'€',GBP:'£',JPY:'JP¥',HKD:'HK$'}[c]||((c||'')+' '); }
  function feeText(o){ var out=[], a=o.apply_fee, p=o.participation_fee;
    if(a&&typeof a==='object'){ if(a.free===true) out.push('免费申请');
      else if(a.amount) out.push('申请费 '+curSym(a.currency)+a.amount); }
    else if(a) out.push(String(a));
    if(p&&typeof p==='object'){ if(p.required===true) out.push('入选后需付费'+(p.amount?(' '+curSym(p.currency)+p.amount):''));
      else if(p.amount) out.push('参展费 '+curSym(p.currency)+p.amount); }
    else if(p) out.push(String(p));
    return out.join(' · '); }
  function fundingText(o){ var f=o.funding; if(!f) return '';
    if(typeof f!=='object') return String(f).slice(0,60);
    var out=[];
    if(f.stipend) out.push(f.stipend===true?'有津贴':('津贴 '+String(f.stipend).slice(0,24)));
    if(f.housing) out.push('含住宿');
    if(f.travel) out.push('报销路费');
    return out.join(' · '); }
  function eligText(o){ var e=o.eligibility; if(!e) return '';
    if(typeof e!=='object') return String(e).slice(0,90);
    var out=[];
    if(e.nationality) out.push(String(e.nationality));
    if(e.age_limit) out.push(String(e.age_limit));
    if(e.students_ok===true) out.push('学生可申请');
    return out.join(' · ').slice(0,90); }

    if(o.published_at) lines.push(L('k_pub')+' '+esc(String(o.published_at).slice(0,10)));

  (function(){
    var sheet=document.getElementById('panel');
    var drag=false, sy=0, ty0=0, curTy=null, moved2=false, downT=null, pend=null, raf=false, lastDy=0;
    function isMob(){ return window.innerWidth<=720; }
    // 必须用布局视口高(与 CSS 的 vh 同基准):手机地址栏收放时 innerHeight 会变,
    // 混用会导致"收回去的位置比初始位高一截"
    function VH(){ return document.documentElement.clientHeight||H; }
    function maxTy(){ return Math.round(VH()*0.59); }   // 收起=下移 59vh(顶边落在 74vh,只露把手+统计行)
    function setTy(ty,animate){
      var mx=maxTy(); ty=Math.max(0,Math.min(mx,ty)); curTy=ty;
      sheet.style.transition=animate?'transform .26s ease':'none';
      sheet.style.transform='translateY('+Math.round(ty)+'px)';
      var p=1-ty/mx;
      if(animate){ targetScale=clampScale(scale0*(1-0.4*p)); }
      else { targetScale=null; proj.scale(clampScale(scale0*(1-0.4*p))); needDraw=true; } }
    function applyPend(){ raf=false; if(pend!=null&&drag){ setTy(pend,false); pend=null; } }
    sheet.addEventListener('pointerdown',function(e){ if(!isMob()) return;
      var t=e.target;
      if(t.closest('.lc-scroll')||t.closest('input')||t.closest('.ai')||t.closest('.lg-item')) return;
      drag=true; moved2=false; downT=t; sy=e.clientY; lastDy=0;
      ty0=(curTy!=null)?curTy:Math.max(0,Math.round(sheet.getBoundingClientRect().top-VH()*0.15));
      sheetDrag=true; spinning=false;
      if(sheet.setPointerCapture){ try{ sheet.setPointerCapture(e.pointerId); }catch(err){} }
      e.preventDefault(); });
    sheet.addEventListener('pointermove',function(e){ if(!drag) return;
      var dy=e.clientY-sy; if(Math.abs(dy)>5) moved2=true;
      lastDy=dy; pend=ty0+dy;
      if(!raf){ raf=true; requestAnimationFrame(applyPend); }
      e.preventDefault(); });
    function up(){ if(!drag) return; drag=false; sheetDrag=false;
      var mx=maxTy(), cur=(curTy!=null)?curTy:mx, mid=mx/2;
      if(!moved2){   // 点一下把手=展开/收起切换
        if(downT&&downT.closest('#sheetbar')) setTy(cur>mid?0:mx,true);
        return; }
      setTy(lastDy>0?mx:0,true); needDraw=true; }   // 按拖拽方向吸附:往下拖=收回原位,往上拖=展开
    sheet.addEventListener('pointerup',up);
    sheet.addEventListener('pointercancel',function(){ drag=false; sheetDrag=false; needDraw=true; });
    window.addEventListener('resize',function(){
      if(!isMob()){ sheet.style.transform=''; sheet.style.transition=''; curTy=null; } });
  })();

  // 图片压缩:长边 ≤max、JPEG(与老站同参:封面 1280/q.78,作品 1600/q.8)
  function shrinkImg(file,max,q,cb){
    if(!file||!/^image\//.test(file.type)){ cb(null); return; }
    var obj=URL.createObjectURL(file), img=new Image();
    img.onload=function(){ URL.revokeObjectURL(obj);
      var sc=Math.min(1,max/Math.max(img.width,img.height));
      var c=document.createElement('canvas');
      c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      var d=c.toDataURL('image/jpeg',q);
      if(d.length>700000) d=c.toDataURL('image/jpeg',0.55);
      cb(d.length>800000?null:d); };
    img.onerror=function(){ URL.revokeObjectURL(obj); cb(null); };
    img.src=obj; }
  function squareAva(file,cb){
    if(!file||!/^image\//.test(file.type)){ cb(null); return; }
    var obj=URL.createObjectURL(file), img=new Image();
    img.onload=function(){ URL.revokeObjectURL(obj);
      var s=Math.min(img.width,img.height), c=document.createElement('canvas');
      c.width=c.height=256;
      c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,256,256);
      cb(c.toDataURL('image/jpeg',0.85)); };
    img.onerror=function(){ URL.revokeObjectURL(obj); cb(null); };
    img.src=obj; }
  function filesToDataURLs(files,max,q,limit,cb){ var out=[],i=0;

  function ntLine(n){ var who=n.actor?('<b>'+esc(n.actor.nickname)+'</b> '):'';
    var pv=(n.ref&&n.ref.preview)?(':'+esc(n.ref.preview)):'';
    var tl=(n.ref&&n.ref.title)?('《'+esc(n.ref.title)+'》'):'';
    if(n.type==='weekly') return L('ntWeekly')+tl;
    if(n.type==='follow') return who+L('ntFollow');
    if(n.type==='reply') return who+L('ntReply')+pv;
    if(n.type==='like') return who+L('ntLike')+pv;
    if(n.type==='comment') return who+L('ntComment')+tl+pv;
    if(n.type==='decide') return L('ntDecide')+' '+tl+((n.ref&&n.ref.preview)?('「'+esc(n.ref.preview)+'」'):'')+
      ':'+((n.ref&&n.ref.result)==='approved'?L('ntOk'):L('ntNo'));
    return esc(n.type); }

  // —— 作品灯箱 ——
  var lbImgs=[], lbI=0;

  document.addEventListener('keydown',function(e){ if(e.key!=='Escape') return;
    var lb=document.getElementById('lightbox');

  document.getElementById('dClose').addEventListener('click',function(){
    document.getElementById('detail').style.display='none'; releaseGuard(); });
  // —— 浏览器返回/手机侧滑在任意层级生效:单守卫历史条目,back 逐层关闭,关完才真正离站 ——
  var apGuard=false, popSuppress=0;

  function ensureGuard(){ if(!apGuard&&layerOpen()){ apGuard=true; try{ history.pushState({ap:1},''); }catch(e2){} } }
  function releaseGuard(){ if(apGuard&&!layerOpen()){ apGuard=false; popSuppress++; try{ history.back(); }catch(e2){} } }
  function closeTopLayer(){
    var lb=document.getElementById('lightbox');
    if(lb.style.display==='flex'){ lb.style.display='none'; return true; }

  document.getElementById('btnLogin').addEventListener('click',function(){
    if(meUser) openProfile(meUser.id); else openAuth('login'); });
  // 用户检索(/api/users/search):输入即搜,点结果在浮层内切换主页
  var uqTimer=null;

  fetch('/api/auth/me',{credentials:'same-origin'}).then(function(r){ return r.json(); }).then(function(j){
    if(j&&j.user){ meUser=j.user; setLoginBtn(); pollNtf(); setInterval(pollNtf,60000); }
  }).catch(function(){});
  // 数据入库(初始加载与检索新增共用):建点/建簇/计数/图例
  var catCounts={opencall:0,residency:0,award:0,workshop:0,jobs:0,news:0,works:0}, placedTotal=0, seenIds={};
  var LEGEND_KEYS=['opencall','residency','award','workshop','jobs','news','works'];
  function addRecords(arr){ var added=0;
    (arr||[]).forEach(function(o){ if(!o||!o.id||seenIds[o.id]) return;
      var loc=D.locate(o); if(!loc) return; seenIds[o.id]=1;
      var cat=CAT[o.category]?o.category:'opencall';
      var jx=(Math.random()-0.5)*1.1, jy=(Math.random()-0.5)*1.1;
      var mll=[loc.ll[0]+jx,loc.ll[1]+jy];
      var mk={o:o,ll:mll,cart:ll2c(mll),prec:loc.prec,sx:null,sy:null,idx:markers.length};
      markers.push(mk);
      var key=o.city_zh||(o.category==='news'&&o.source)||(o.ip_region&&(o.ip_region.city||o.ip_region.disp))||o.country_zh||'其他';   // 资讯按信源聚簇,作品按属地聚簇
      var g=groups[key]||(groups[key]={key:key,ll:loc.ll,cart:ll2c(loc.ll),items:[],sx:null,sy:null,r:0,count:0,single:null});
      g.items.push(mk);
      catCounts[cat]=(catCounts[cat]||0)+1; placedTotal++; added++; });
    document.getElementById('total').innerHTML=placedTotal+'<small>'+L('unit')+'</small>';
    renderLegend(); renderDrawer(); needDraw=true; return added; }
  // —— 抽屉列表:与地球同一份筛选状态,双向联动 ——
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(ch){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]; }); }
  function dlRank(o){ if(!o.deadline) return 5e8;
    var d=new Date(o.deadline+'T23:59:59'); if(isNaN(d)) return 5e8;
    var n=Math.ceil((d-Date.now())/86400000);
    return n<0 ? 2e9-n : n; }   // 未过期越近越前;常年居中后;已过期置底
  function renderDrawer(){
    var el=document.getElementById('lcList'); if(!el) return;
    var srt=document.getElementById('lcSort');
    if(srt) srt.textContent=(sortBy==='deadline'?L('sortDL'):L('sortNew'))+' ⇅';
    var arr=[], n=0;
    for(var i0=0;i0<markers.length;i0++){ if(matchFilter(markers[i0].o)) arr.push(markers[i0]); }
    n=arr.length;
    if(sortBy==='deadline') arr.sort(function(a,b){ return dlRank(a.o)-dlRank(b.o); });
    else arr.sort(function(a,b){ return b.idx-a.idx; });
    var out=[];
    for(var i=0;i<arr.length;i++){ var o=arr[i].o;
      if(out.length<400){ var c=CAT[o.category]||CAT.opencall;
        var cov=o.cover?esc(o.cover):'';
        var th='<span class="th"><span class="ph" style="background:'+c.color+'">'+esc((tt(o)||'·').charAt(0))+'</span>'+
          (cov?'<img loading="lazy" src="'+cov+'" onerror="this.style.display=\'none\'" alt="">':'')+'</span>';
        out.push('<div class="oc" data-i="'+arr[i].idx+'"><span class="bar" style="background:'+c.color+'"></span>'+th+'<div>'+
          '<div class="t">'+esc(tt(o))+'</div>'+
          '<div class="m">'+esc([o.city_zh||o.country_zh||o.org_zh,o.deadline?(L('k_dl')+' '+o.deadline):''].filter(Boolean).join(' · '))+'</div></div></div>'); } }
    document.getElementById('lcCount').textContent=L('listN')(n);
    el.innerHTML=out.join(''); }
  function selectCard(d){ var prev=document.querySelector('.oc.sel'); if(prev) prev.classList.remove('sel');
    if(d){ d.classList.add('sel'); d.scrollIntoView({block:'nearest'}); } }
  function syncCard(mk){ selectCard(document.querySelector('.oc[data-i="'+mk.idx+'"]')); }
  document.getElementById('lcList').addEventListener('click',function(e){
    var d=e.target.closest('.oc'); if(!d) return;
    var mk=markers[+d.getAttribute('data-i')]; if(!mk) return;
    selectCard(d); flyTo(mk.ll, Math.max(splitScale()*1.5, proj.scale())); showDetail(mk.o); });
  // 悬停卡片 → 地球上对应点位/城市簇亮环(双向联动)
  document.getElementById('lcList').addEventListener('mouseover',function(e){
    var d=e.target.closest('.oc'); if(!d) return;

  document.getElementById('lcList').addEventListener('mouseout',function(e){
    if(e.target.closest('.oc')){ focusMk=null; focusKey=null; needDraw=true; } });
  function renderLegend(){
    document.getElementById('legend').innerHTML=LEGEND_KEYS.map(function(k2){
      return '<div class="lg-item'+((filterCat!=='all'&&filterCat!==k2)?' off':'')+'" data-cat="'+k2+'"><span class="sw" style="background:'+CAT[k2].color+'"></span><span class="nm">'+catName(k2)+'</span><span class="ct">'+(catCounts[k2]||0)+'</span></div>'; }).join('');
    d3.selectAll('#legend .lg-item').on('click',function(){ var k3=this.getAttribute('data-cat');
      filterCat=(filterCat===k3)?'all':k3;
      syncLegend(); renderDrawer(); needDraw=true; }); }
  // 门类 chips(单选,再点取消)+ 快捷筛选开关(多选)——面板与频道浮层多宿主同渲染,同一份状态
  function renderTagRow(){
    var hosts=document.querySelectorAll('[data-tagrow]'); if(!hosts.length) return;
    var html='<span class="tgc'+(tagSel===''?' on':'')+'" data-tag="">'+L('tagAll')+'</span>'+
      D.TAGS.map(function(t){
        return '<span class="tgc'+(tagSel===t.id?' on':'')+'" data-tag="'+t.id+'">'+

  // 地区多选行(老站六大区,再点取消;「全部」清空)
  var REG_KEYS=['cn','hktw','asia','europe','namerica','other'];
  function renderRegRow(){
    var hosts=document.querySelectorAll('[data-regrow]'); if(!hosts.length) return;
    var html='<span class="tgc'+(!regsActive()?' on':'')+'" data-reg="all">'+L('regAll')+'</span>'+
      REG_KEYS.map(function(k){
        return '<span class="tgc'+(fRegs[k]?' on':'')+'" data-reg="'+k+'">'+L('reg_'+k)+'</span>'; }).join('');
    for(var hi=0;hi<hosts.length;hi++) hosts[hi].innerHTML=html;

      if(curCh) showChPanel(curCh); }); }
  function renderFltRow(){
    var hosts=document.querySelectorAll('[data-fltrow]'); if(!hosts.length) return;
    var items=[['fFree',fFree],['fStipend',fStipend],['fHousing',fHousing],['fTravel',fTravel],
      ['fVerified',fVerified],['fHidePast',fHidePast],
      ['fOrgOff',fOrgOff],['fOrgInd',fOrgInd],['fOrgCom',fOrgCom],

    for(var hi=0;hi<hosts.length;hi++) hosts[hi].innerHTML=html;
    d3.selectAll('[data-fltrow] .tgc').on('click',function(){
      var k4=this.getAttribute('data-f');
      if(k4==='fFree') fFree=!fFree; else if(k4==='fStipend') fStipend=!fStipend;

      else if(k4==='fVerified') fVerified=!fVerified; else if(k4==='fHidePast') fHidePast=!fHidePast;
      else if(k4==='fOrgOff') fOrgOff=!fOrgOff; else if(k4==='fOrgInd') fOrgInd=!fOrgInd;
      else if(k4==='fOrgCom') fOrgCom=!fOrgCom;
      else if(k4==='fSrcUser') fSrcUser=!fSrcUser; else if(k4==='fSrcAI') fSrcAI=!fSrcAI;
      renderFltRow(); renderDrawer(); needDraw=true;
      if(curCh) showChPanel(curCh); }); }
  document.getElementById('lcSort').addEventListener('click',function(){
    sortBy=(sortBy==='deadline')?'new':'deadline'; renderDrawer(); });
  function flyToRecord(rec){ var loc=D.locate(rec); if(loc) flyTo(loc.ll, Math.max(splitScale()*1.5, proj.scale())); }
  // ✦ AI 检索:真调用 /api/search,新机会实时落点地球
  var searching=false;
  function runSearch(){
    if(searching) return;
    var q2=document.getElementById('q').value.trim();
    if(!q2){ toast('输入关键词后点我:AI 全网检索,结果直接落点地球'); return; }
    searching=true; var btn=document.getElementById('btnAI'); btn.textContent=L('aiing');
    toast('AI 正在全网检索「'+q2+'」,通常 30~90 秒,期间可继续转地球…');
    fetch('/api/search?q='+encodeURIComponent(q2)+'&channel=opportunities')
      .then(function(r){ return r.json(); })
      .then(function(r){
        if(r&&r.added&&r.added.length){ var n=addRecords(r.added);
          chStore.opportunities=(chStore.opportunities||[]).concat(r.added);
          toast('检索完成:新收录 '+r.addedCount+' 条,'+n+' 条已落点地球');
          if(n) flyToRecord(r.added[0]); }
        else toast((r&&(r.message||r.error))||'检索完成:本次未发现可核实的新机会'); })
      .catch(function(){ toast('检索失败,请稍后再试'); })
      .then(function(){ searching=false; btn.textContent=L('ai'); }); }
  document.getElementById('btnAI').addEventListener('click',runSearch);
  document.getElementById('q').addEventListener('keydown',function(e){ if(e.key==='Enter') runSearch(); });

  // —— 面板(分类过滤统一走左侧图例) ——
  function syncLegend(){ d3.selectAll('#legend .lg-item').classed('off',function(){
    return filterCat!=='all'&&this.getAttribute('data-cat')!==filterCat; }); }
  document.getElementById('q').addEventListener('input',function(e){ query=e.target.value.trim(); renderDrawer(); needDraw=true; });
  window.addEventListener('resize',resize);

  // —— 数据加载 ——
  setLoginBtn(); applyLang();   // 登录钮默认态 + 语言应用(共享 ap_lang)
  resize(); proj.rotate([-100,-30]);
  // 招聘/资讯归一化成球面记录:字段对齐机会口径(city→city_zh 等),category 改频道键
  function normJob(it,i){ return Object.assign({},it,{ category:'jobs',
    id:it.id||('job-x'+i), title_zh:it.title_zh||it.title, org_zh:it.org_zh||it.org,
    city_zh:it.city_zh||it.city, country_zh:it.country_zh||it.country, url:it.apply_url||it.url }); }
  function normNews(it,i){ return Object.assign({},it,{ category:'news', topic:it.category||'',
    id:it.id||('news-x'+i), title_zh:it.title_zh||it.title, org_zh:it.org_zh||it.source, url:it.url }); }
  // 作品:按作品发布时 IP 属地落点(缺失回落作者当前属地),trust=用户投稿
  function normWork(w){ return { id:'work-'+w.id, category:'works',
    title_zh:w.title||'无题', title_en:w.title||'', org_zh:(w.author&&w.author.nickname)||'佚名',
    cover:(w.images&&w.images[0])||'', images:w.images||[], n:w.n||((w.images||[]).length),
    summary_zh:w.description||'', trust:'user', tags:w.tags||[],
    ip_region:w.ip_region||(w.author&&w.author.ip_region)||null }; }
  // 首屏只等最小关键路径(世界底图 ~110KB):先把地球画出来;
  // 四频道数据各自异步到达、增量落点(opportunities 已 1MB,绝不挡首屏)
  d3.json('data/geo/countries-110m.json').then(function(res0){
    countryFeats=topojson.feature(res0,res0.objects.countries).features;
    countryFeats.forEach(function(f){ if(f.properties.name==='China') cnNE=f; });   // 下钻视野自适应与境外判定用
    labelData=countryFeats.map(function(f){ var nm=D.NAME_ZH[f.properties.name]; if(!nm) return null;
      if(f.properties.name==='Taiwan') return null;   // 台湾不作独立国家标注(属中国)
      var ar=d3.geoArea(f), cen=d3.geoCentroid(f);
      return {c:cen,cart:ll2c(cen),nm:nm,en:f.properties.name,r:Math.sqrt(ar/Math.PI),
        sz:ar>0.05?18:(ar>0.008?13:10)}; }).filter(Boolean);
    // 载入中国官方边界(合规:台湾省/港澳、九段线、藏南阿克赛钦按国标;本地自托管+远端兜底+重试)
    CN_CART=ll2c([104,35.5]);
    loadCN(0,0);
    d3.json('data/opportunities.json').then(function(j){
      var arr=j?(j.items||j.opportunities||j):[]; if(!Array.isArray(arr)) arr=[];
      chStore.opportunities=arr; addRecords(arr);
      var st2=document.getElementById('status');
      if(st2.style.display!=='none') st2.textContent=L('marked')(placedTotal,countryFeats.length);
    }).catch(function(){});
    d3.json('data/jobs.json').then(function(j){ chCache.jobs=j;
      chNorm.jobs=(j.jobs||j.items||[]).map(normJob); addRecords(chNorm.jobs); }).catch(function(){});
    d3.json('data/news.json').then(function(j){ chCache.news=j;
      chNorm.news=(j.items||[]).map(normNews); addRecords(chNorm.news); }).catch(function(){});
    fetch('/api/works/feed').then(function(r){ return r.json(); }).then(function(j){
      if(!j||!j.works) return; chCache.works=j;
      addRecords(j.works.map(normWork)); }).catch(function(){});
    window.__gd={groups:groups,markers:markers,proj:proj,splitScale:splitScale,CATc:CAT,  // 调试钩子(集成时移除)
      state:function(){return {drillLevel:drillLevel,drilled:drilledCountry,prov:drilledProvAdcode,
        cnBase:cnBase?cnBase.length:0,cnJD:!!cnJD,adminFeats:adminFeats.length,
        provLabels:provLabels.length,adminLabels:adminLabels.map(function(a){return a.nm;}),
        maxK:Math.round(maxK*10)/10,scaleK:Math.round(proj.scale()/scale0*100)/100,
        rot:proj.rotate().map(function(v){return Math.round(v*10)/10;}),
        detailOpen:document.getElementById('detail').style.display==='block'};},
      drillChina:function(){drillChina();},
      fitScaleFor:fitScaleFor, cnNE:function(){return cnNE;}, scale0:function(){return scale0;},
      cnBaseFeats:function(){return cnBase;}, boundsCenter:boundsCenter,
      drillProvByName:function(n){for(var i=0;i<cnBase.length;i++){if(cnBase[i].properties.name===n){drillProvince(cnBase[i]);return cnBase[i].properties.adcode;}}return null;},
      exitDrill:function(){exitDrill();}};
    var st=document.getElementById('status'); st.textContent=L('marked')(placedTotal,countryFeats.length);
    setTimeout(function(){ st.style.display='none'; },2500);
    draw();
  }).catch(function(err){ document.getElementById('status').textContent='加载失败:'+err.message; });
})();

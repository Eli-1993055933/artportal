<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>ArtPortal 管理后台</title>
<style>
  /* 布局学 Ant Design Pro / Stripe 后台:左侧导航分页面(一次只看一个模块),
     每模块自带 搜索/过滤/分页,绝不一次渲染几百行;待办数直接标在导航角标上。 */
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: #14161a; color: #e8e8e6; font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 20px; letter-spacing: .04em; }
  /* 登录 */
  .login { max-width: 320px; margin: 18vh auto 0; padding: 0 20px; }
  .login input { width: 100%; height: 44px; border-radius: 8px; border: 1px solid #333; background: #1d2026; color: #fff; padding: 0 12px; font-size: 14px; margin-bottom: 10px; }
  .login button { width: 100%; height: 44px; border-radius: 8px; border: none; background: #e8e8e6; color: #14161a; font-size: 14px; font-weight: 600; cursor: pointer; }
  .login .err { color: #ff7a6e; font-size: 12px; min-height: 18px; margin: 4px 0; }
  /* 框架:侧栏 + 主区 */
  .layout { display: flex; min-height: 100vh; }
  .side { width: 190px; flex: none; border-right: 1px solid #2a2e36; padding: 18px 10px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
  .side__brand { font-size: 15px; font-weight: 700; letter-spacing: .04em; padding: 0 10px 14px; }
  .side__brand small { display: block; color: #8b8f98; font-weight: 400; font-size: 11px; margin-top: 2px; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav button {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    border: none; background: transparent; color: #aab; font-size: 13.5px; cursor: pointer;
    padding: 9px 12px; border-radius: 8px; text-align: left;
  }
  .nav button:hover { background: #1d2026; color: #e8e8e6; }
  .nav button.is-active { background: #23272e; color: #fff; font-weight: 600; }
  .side__foot { margin-top: auto; padding: 10px 12px; font-size: 11px; color: #666b75; }
  .main { flex: 1; min-width: 0; padding: 20px 22px 60px; }
  .sec__title { font-size: 16px; margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
  /* 概览卡 */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .card { background: #1d2026; border: 1px solid #2a2e36; border-radius: 10px; padding: 12px 14px; }
  .card .k { font-size: 12px; color: #8b8f98; }
  .card .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .card .v.hot { color: #7ee08a; }
  h2 { font-size: 14px; color: #aab; margin: 24px 0 10px; }
  /* 工具条:搜索 + 过滤 chips + 计数 */
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .searchbox { width: 250px; max-width: 100%; height: 34px; border-radius: 8px; border: 1px solid #333; background: #1d2026; color: #fff; padding: 0 10px; font-size: 13px; }
  .fchip { border: 1px solid #2a2e36; background: #1d2026; color: #aab; font-size: 12px; padding: 5px 12px; border-radius: 999px; cursor: pointer; }
  .fchip.is-active { background: #e8e8e6; color: #14161a; border-color: #e8e8e6; font-weight: 600; }
  .count { font-size: 12px; color: #8b8f98; margin-left: auto; }
  /* 表格 */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #2a2e36; white-space: nowrap; }
  th { color: #8b8f98; font-weight: 500; font-size: 12px; position: sticky; top: 0; background: #1d2026; }
  td.mono { font-variant-numeric: tabular-nums; color: #aab; }
  .scroll { overflow-x: auto; border: 1px solid #2a2e36; border-radius: 10px; background: #1d2026; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; background: #2a2e36; color: #aab; }
  .pill.on { background: #1d3a24; color: #7ee08a; }
  .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 18px; padding: 0 6px; border-radius: 999px; font-size: 11px; background: #2a2e36; color: #aab; }
  .badge.hot { background: #4a2418; color: #ffb08a; font-weight: 700; }
  .muted { color: #666b75; }
  /* 分页器 */
  .pager { display: flex; align-items: center; gap: 10px; justify-content: flex-end; padding: 10px 2px 0; font-size: 12.5px; color: #8b8f98; }
  .pager button { border: 1px solid #2a2e36; background: #1d2026; color: #aab; border-radius: 7px; padding: 5px 12px; font-size: 12.5px; cursor: pointer; }
  .pager button:disabled { opacity: .35; cursor: default; }
  /* 手机:侧栏变顶部横滑 tab */
  @media (max-width: 899px) {
    .layout { flex-direction: column; }
    .side { width: auto; height: auto; position: sticky; top: 0; z-index: 5; background: #14161a; border-right: none; border-bottom: 1px solid #2a2e36; padding: 10px 12px 0; }
    .side__brand { padding: 0 2px 8px; }
    .side__brand small { display: inline; margin-left: 8px; }
    .nav { flex-direction: row; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
    .nav::-webkit-scrollbar { display: none; }
    .nav button { flex: none; padding: 7px 12px; }
    .side__foot { display: none; }
    .main { padding: 14px 12px 50px; }
    .searchbox { width: 100%; }
    .count { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
  <!-- 登录 -->
  <div class="login" id="loginView">
    <h1>ArtPortal 管理后台</h1>
    <input type="password" id="pw" placeholder="管理密码" autocomplete="current-password" />
    <div class="err" id="loginErr"></div>
    <button id="loginBtn" type="button">进入</button>
  </div>

  <!-- 框架:左侧导航 + 单模块主区 -->
  <div id="dash" class="layout" hidden>
    <aside class="side">
      <div class="side__brand">ArtPortal 后台<small id="now"></small></div>
      <nav class="nav" id="nav">
        <button data-view="overview" class="is-active">概览</button>
        <button data-view="subs">投稿审核 <span class="badge" id="navSubN">0</span></button>
        <button data-view="works">作品审核 <span class="badge" id="navWorkN">0</span></button>
        <button data-view="content">内容管理 <span class="badge" id="navContentN">0</span></button>
        <button data-view="recycle">回收站 <span class="badge" id="navRecycleN">0</span></button>
        <button data-view="ingest">检索溯源</button>
        <button data-view="users">用户 <span class="badge" id="navUserN">0</span></button>
      </nav>
      <div class="side__foot">每 10 秒自动刷新</div>
    </aside>

    <main class="main">
      <!-- 概览 -->
      <section data-sec="overview">
        <h1 class="sec__title">概览</h1>
        <div class="cards" id="cards"></div>
        <h2>当前在线(近 5 分钟有心跳)</h2>
        <div class="scroll"><table id="onlineTbl"><thead><tr><th>用户</th><th>最近活动</th></tr></thead><tbody></tbody></table></div>
        <h2>近期事件(最新 30 条)</h2>
        <div class="scroll"><table id="evtTbl"><thead><tr><th>时间</th><th>类型</th><th>谁</th><th>详情</th></tr></thead><tbody></tbody></table></div>
      </section>

      <!-- 投稿审核 -->
      <section data-sec="subs" hidden>
        <h1 class="sec__title">投稿审核 <span class="pill" id="subPending">0 待审</span></h1>
        <div class="toolbar" id="subFilter">
          <button class="fchip is-active" data-st="">全部</button>
          <button class="fchip" data-st="pending">待审</button>
          <button class="fchip" data-st="approved">已通过</button>
          <button class="fchip" data-st="rejected">已拒绝</button>
          <span class="count" id="subCount"></span>
        </div>
        <div class="scroll"><table id="subTbl"><thead><tr><th>时间</th><th>标题</th><th>类别</th><th>主办方</th><th>链接</th><th>机审</th><th>投稿人</th><th>状态</th><th>操作</th></tr></thead><tbody></tbody></table></div>
        <div class="pager" id="subPager"></div>
      </section>

      <!-- 作品审核(8.3):待审图片在非公开目录,预览走 /api/admin/works/img -->
      <section data-sec="works" hidden>
        <h1 class="sec__title">作品审核 <span class="pill" id="workPending">0 待审</span></h1>
        <div class="toolbar" id="workFilter">
          <button class="fchip is-active" data-st="">全部</button>
          <button class="fchip" data-st="pending">待审</button>
          <button class="fchip" data-st="approved">已通过</button>
          <button class="fchip" data-st="rejected">已拒绝</button>
          <span class="count" id="workCount"></span>
        </div>
        <div class="scroll"><table id="workTbl"><thead><tr><th>时间</th><th>预览</th><th>标题/说明</th><th>张数</th><th>作者</th><th>机审</th><th>举报</th><th>状态</th><th>操作</th></tr></thead><tbody></tbody></table></div>
        <div class="pager" id="workPager"></div>
      </section>

      <!-- 内容管理 -->
      <section data-sec="content" hidden>
        <h1 class="sec__title">内容管理 <span class="muted" style="font-size:12px">(展览项目信息;删除进回收站)</span></h1>
        <div class="toolbar" id="contentFilter">
          <input class="searchbox" id="contentSearch" placeholder="按标题/机构/ID 搜索…" />
          <button class="fchip is-active" data-via="">全部来源</button>
          <button class="fchip" data-via="daily">每日抓取</button>
          <button class="fchip" data-via="search">AI检索</button>
          <button class="fchip" data-via="submit">用户投稿</button>
          <span class="count" id="contentCount"></span>
        </div>
        <div class="scroll"><table id="contentTbl"><thead><tr><th>标题</th><th>类别</th><th>机构</th><th>来源</th><th>检索者</th><th>更新</th><th>操作</th></tr></thead><tbody></tbody></table></div>
        <div class="pager" id="contentPager"></div>
      </section>

      <!-- 回收站 -->
      <section data-sec="recycle" hidden>
        <h1 class="sec__title">回收站 <span class="pill" id="recycleN">0</span></h1>
        <div class="scroll"><table id="recycleTbl"><thead><tr><th>删除时间</th><th>标题</th><th>机构</th><th>操作</th></tr></thead><tbody></tbody></table></div>
        <div class="pager" id="recyclePager"></div>
      </section>

      <!-- 检索溯源 -->
      <section data-sec="ingest" hidden>
        <h1 class="sec__title">检索入库溯源 <span class="muted" style="font-size:12px">(谁的检索把信息带进了库)</span></h1>
        <div class="scroll"><table id="ingestTbl"><thead><tr><th>时间</th><th>频道</th><th>检索词</th><th>入库条目</th><th>用户</th></tr></thead><tbody></tbody></table></div>
        <div class="pager" id="ingestPager"></div>
      </section>

      <!-- 用户 -->
      <section data-sec="users" hidden>
        <h1 class="sec__title">注册用户名册</h1>
        <div class="toolbar">
          <input class="searchbox" id="userSearch" placeholder="按邮箱/昵称搜索…" />
          <span class="count" id="userCount"></span>
        </div>
        <div class="scroll"><table id="usersTbl"><thead><tr><th>头像</th><th>昵称</th><th>邮箱</th><th>验证</th><th>注册时间</th><th>最近活跃</th><th>收藏</th></tr></thead><tbody></tbody></table></div>
        <div class="pager" id="userPager"></div>
      </section>
    </main>
  </div>
<script>
(function () {
  "use strict";
  var allUsers = [], allContent = [], allSubs = [], allRecycle = [], allIngests = [];
  var view = "overview";
  // 各模块分页/过滤状态(刷新数据时保留页码,不打断管理员操作)
  var st = {
    subs:    { page: 1, per: 30, status: "" },
    works:   { page: 1, per: 30, status: "" },
    content: { page: 1, per: 50, q: "", via: "" },
    recycle: { page: 1, per: 50 },
    ingest:  { page: 1, per: 50 },
    users:   { page: 1, per: 50, q: "" }
  };

  function $(id) { return document.getElementById(id); }
  function post(url, data) {
    return fetch(url, { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data || {}) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, data: j }; }); });
  }
  function get(url) {
    return fetch(url, { credentials: "same-origin" }).then(function (r) {
      if (r.status === 401) throw new Error("unauth");
      return r.json();
    });
  }
  function rel(ts) {
    var t = typeof ts === "number" ? ts : Date.parse(ts);
    if (!t) return "—";
    var s = Math.round((Date.now() - t) / 1000);
    if (s < 60) return s + " 秒前";
    if (s < 3600) return Math.round(s / 60) + " 分钟前";
    if (s < 86400) return Math.round(s / 3600) + " 小时前";
    return Math.round(s / 86400) + " 天前";
  }
  function td(text, cls) { var el = document.createElement("td"); el.textContent = text == null ? "—" : String(text); if (cls) el.className = cls; return el; }
  // 事件/注册时间存的是 UTC ISO;后台按【北京时间】显示(+8 小时)
  function bj(iso, withDate) {
    if (!iso) return "—";
    var t = Date.parse(iso); if (isNaN(t)) return iso;
    var s = new Date(t + 8 * 3600 * 1000).toISOString();
    return withDate ? s.slice(0, 16).replace("T", " ") : s.slice(5, 19).replace("T", " ");
  }
  function bjClock() { return new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(11, 19); }
  function emptyRow(tb, text, colSpan) {
    var tr = document.createElement("tr");
    var c = td(text, "muted"); c.colSpan = colSpan;
    tr.appendChild(c); tb.appendChild(tr);
  }
  // 分页器:list 取当页切片渲染,页脚给 共N条 · 页码 + 上/下页
  function paginate(list, s, pagerEl, renderRow, tb, colSpan, emptyText) {
    tb.textContent = "";
    var total = list.length, pages = Math.max(1, Math.ceil(total / s.per));
    if (s.page > pages) s.page = pages;
    if (!total) { emptyRow(tb, emptyText, colSpan); pagerEl.textContent = ""; return; }
    list.slice((s.page - 1) * s.per, s.page * s.per).forEach(renderRow);
    pagerEl.textContent = "";
    var info = document.createElement("span");
    info.textContent = "共 " + total + " 条 · 第 " + s.page + " / " + pages + " 页";
    var prev = document.createElement("button"); prev.textContent = "‹ 上一页"; prev.disabled = s.page <= 1;
    var next = document.createElement("button"); next.textContent = "下一页 ›"; next.disabled = s.page >= pages;
    prev.addEventListener("click", function () { s.page--; renderActive(); });
    next.addEventListener("click", function () { s.page++; renderActive(); });
    pagerEl.appendChild(info); pagerEl.appendChild(prev); pagerEl.appendChild(next);
  }

  // —— 登录 ——
  function tryLogin() {
    post("/api/admin/login", { password: $("pw").value }).then(function (r) {
      if (!r.ok) { $("loginErr").textContent = r.data && r.data.error || "登录失败"; return; }
      $("loginView").hidden = true; $("dash").hidden = false;
      refresh(); setInterval(refresh, 10000);
    });
  }
  $("loginBtn").addEventListener("click", tryLogin);
  $("pw").addEventListener("keydown", function (e) { if (e.key === "Enter") tryLogin(); });

  // —— 导航:一次只显示一个模块 ——
  $("nav").addEventListener("click", function (e) {
    var b = e.target.closest("[data-view]");
    if (!b) return;
    view = b.getAttribute("data-view");
    var btns = document.querySelectorAll("#nav [data-view]");
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle("is-active", btns[i] === b);
    var secs = document.querySelectorAll("[data-sec]");
    for (var j = 0; j < secs.length; j++) secs[j].hidden = secs[j].getAttribute("data-sec") !== view;
    renderActive();
    window.scrollTo(0, 0);
  });
  function renderActive() {
    if (view === "overview") { /* overview 由 refresh 渲染 */ }
    else if (view === "subs") renderSubs();
    else if (view === "works") renderWorks();
    else if (view === "content") renderContent();
    else if (view === "recycle") renderRecycle();
    else if (view === "ingest") renderIngests();
    else if (view === "users") renderUsers();
  }

  // —— 概览 ——
  var CARD_DEFS = [
    ["registered_total", "注册用户总数"], ["registered_today", "今日新注册"],
    ["online_users_n", "在线·已登录"], ["online_anon", "在线·访客"],
    ["t_visit", "今日访问"], ["t_search", "今日检索"], ["t_outbound", "今日去官网"], ["t_login", "今日登录"]
  ];
  function renderCards(o) {
    var vals = {
      registered_total: o.registered_total, registered_today: o.registered_today,
      online_users_n: o.online_users.length, online_anon: o.online_anon,
      t_visit: o.today.visit, t_search: o.today.search, t_outbound: o.today.outbound, t_login: o.today.login
    };
    var box = $("cards"); box.textContent = "";
    CARD_DEFS.forEach(function (d) {
      var c = document.createElement("div"); c.className = "card";
      var k = document.createElement("div"); k.className = "k"; k.textContent = d[1];
      var v = document.createElement("div"); v.className = "v" + ((d[0] === "online_users_n" || d[0] === "online_anon") && vals[d[0]] > 0 ? " hot" : "");
      v.textContent = String(vals[d[0]] == null ? 0 : vals[d[0]]);
      c.appendChild(k); c.appendChild(v); box.appendChild(c);
    });
  }
  function renderOnline(list) {
    var tb = $("onlineTbl").tBodies[0]; tb.textContent = "";
    if (!list.length) { emptyRow(tb, "(当前没有已登录用户在线;访客数见上方卡片)", 2); return; }
    list.sort(function (a, b) { return b.last - a.last; }).forEach(function (u) {
      var tr = document.createElement("tr");
      tr.appendChild(td(u.email));
      tr.appendChild(td(rel(u.last), "mono"));
      tb.appendChild(tr);
    });
  }
  var EVT_NAME = { visit: "访问", outbound: "去官网", search: "检索", register: "注册", login: "登录", submit: "投稿", profile: "改资料" };
  function renderEvents(list) {
    var tb = $("evtTbl").tBodies[0]; tb.textContent = "";
    list.forEach(function (e) {
      var tr = document.createElement("tr");
      tr.appendChild(td(bj(e.t, false), "mono"));
      var typeCell = document.createElement("td");
      var pill = document.createElement("span"); pill.className = "pill" + (e.type === "register" ? " on" : "");
      pill.textContent = EVT_NAME[e.type] || e.type; typeCell.appendChild(pill); tr.appendChild(typeCell);
      tr.appendChild(td(e.email || (e.anon ? "访客 " + e.anon : "—")));
      tr.appendChild(td(e.q || e.id || "", "muted"));
      tb.appendChild(tr);
    });
  }

  // —— 用户 ——
  function renderUsers() {
    var q = st.users.q.trim().toLowerCase();
    var list = allUsers.filter(function (u) { return !q || (u.email || "").indexOf(q) !== -1 || (u.nickname || "").toLowerCase().indexOf(q) !== -1; });
    $("userCount").textContent = q ? "命中 " + list.length + " / " + allUsers.length : "";
    paginate(list, st.users, $("userPager"), function (u) {
      var tr = document.createElement("tr");
      var av = document.createElement("td");
      if (u.avatar) { var im = document.createElement("img"); im.src = "/" + u.avatar; im.style.cssText = "width:26px;height:26px;border-radius:50%;object-fit:cover;display:block"; av.appendChild(im); }
      else av.textContent = "—";
      tr.appendChild(av);
      tr.appendChild(td(u.nickname || "(未设置)", u.nickname ? "" : "muted"));
      tr.appendChild(td(u.email));
      // 邮箱验证:验证码注册的 ✓;发信启用前注册的老账号显示 —(仅弱校验)
      var vc = document.createElement("td");
      var vp = document.createElement("span");
      vp.className = "pill" + (u.verified ? " on" : "");
      vp.textContent = u.verified ? "✓ 已验证" : "未验证";
      vp.title = u.verified ? "验证码注册,邮箱真实" : "注册于发信启用前(仅域名弱校验)";
      vc.appendChild(vp); tr.appendChild(vc);
      tr.appendChild(td(bj(u.created_at, true), "mono"));
      tr.appendChild(td(rel(u.last_seen), "mono"));
      tr.appendChild(td(u.favorites, "mono"));
      $("usersTbl").tBodies[0].appendChild(tr);
    }, $("usersTbl").tBodies[0], 7, "(还没有注册用户)");
  }
  $("userSearch").addEventListener("input", function () { st.users.q = this.value; st.users.page = 1; renderUsers(); });

  // —— 内容管理 ——
  var VIA = { search: "AI检索", submit: "用户投稿", daily: "每日抓取" };
  function renderContent() {
    var q = st.content.q.trim().toLowerCase(), via = st.content.via;
    var list = allContent.filter(function (o) {
      if (via && (o.via || "daily") !== via) return false;
      return !q || (o.title || "").toLowerCase().indexOf(q) !== -1 || (o.org || "").toLowerCase().indexOf(q) !== -1 || o.id.indexOf(q) !== -1;
    });
    $("contentCount").textContent = "命中 " + list.length + " / 共 " + allContent.length + " 条";
    paginate(list, st.content, $("contentPager"), function (o) {
      var tr = document.createElement("tr");
      var t = td(o.title); t.style.whiteSpace = "normal"; t.style.maxWidth = "260px"; tr.appendChild(t);
      tr.appendChild(td(o.category));
      tr.appendChild(td(o.org));
      tr.appendChild(td(VIA[o.via] || o.via || "每日抓取"));
      tr.appendChild(td(o.searched_by || "—", o.searched_by ? "" : "muted"));
      tr.appendChild(td((o.updated_at || "").slice(0, 10), "mono"));
      var ops = document.createElement("td");
      var del = document.createElement("button");
      del.textContent = "删除";
      del.style.cssText = "padding:3px 10px;border-radius:6px;border:none;cursor:pointer;background:#3a1d1d;color:#ff9a8a";
      del.addEventListener("click", function () {
        if (!confirm("删除「" + o.title + "」?(会进回收站,可恢复)")) return;
        post("/api/admin/content/delete", { id: o.id }).then(function (r) {
          if (!r.ok) { alert(r.data && r.data.error || "删除失败"); return; }
          refreshContent();
        });
      });
      ops.appendChild(del); tr.appendChild(ops);
      $("contentTbl").tBodies[0].appendChild(tr);
    }, $("contentTbl").tBodies[0], 7, "(没有匹配的内容)");
  }
  $("contentSearch").addEventListener("input", function () { st.content.q = this.value; st.content.page = 1; renderContent(); });
  $("contentFilter").addEventListener("click", function (e) {
    var c = e.target.closest(".fchip"); if (!c) return;
    st.content.via = c.getAttribute("data-via"); st.content.page = 1;
    var chips = this.querySelectorAll(".fchip");
    for (var i = 0; i < chips.length; i++) chips[i].classList.toggle("is-active", chips[i] === c);
    renderContent();
  });

  // —— 回收站 ——
  function renderRecycle() {
    $("recycleN").textContent = String(allRecycle.length);
    $("navRecycleN").textContent = String(allRecycle.length);
    paginate(allRecycle, st.recycle, $("recyclePager"), function (r) {
      var p = r.payload || {};
      var tr = document.createElement("tr");
      tr.appendChild(td(bj(r.deleted_at, true), "mono"));
      var t = td(p.title_zh || p.title_en || r.record_id); t.style.whiteSpace = "normal"; t.style.maxWidth = "280px"; tr.appendChild(t);
      tr.appendChild(td(p.org_zh || "—"));
      var ops = document.createElement("td");
      [["restore", "恢复", "#1d3a24", "#7ee08a"], ["purge", "彻底删除", "#3a1d1d", "#ff9a8a"]].forEach(function (d) {
        var b = document.createElement("button");
        b.textContent = d[1];
        b.style.cssText = "margin-right:6px;padding:3px 10px;border-radius:6px;border:none;cursor:pointer;background:" + d[2] + ";color:" + d[3];
        b.addEventListener("click", function () {
          if (d[0] === "purge" && !confirm("彻底删除「" + (p.title_zh || r.record_id) + "」?不可恢复!")) return;
          post("/api/admin/recycle/" + d[0], { id: r.id }).then(function (x) {
            if (!x.ok) { alert(x.data && x.data.error || "操作失败"); return; }
            refreshContent();
          });
        });
        ops.appendChild(b);
      });
      tr.appendChild(ops);
      $("recycleTbl").tBodies[0].appendChild(tr);
    }, $("recycleTbl").tBodies[0], 4, "(回收站为空)");
  }

  // —— 检索溯源 ——
  function renderIngests() {
    paginate(allIngests, st.ingest, $("ingestPager"), function (g) {
      var tr = document.createElement("tr");
      tr.appendChild(td(bj(g.at, false), "mono"));
      tr.appendChild(td({ opportunities: "机会", news: "资讯", jobs: "招聘" }[g.channel] || g.channel));
      tr.appendChild(td(g.q || "—"));
      var t = td(g.title || g.record_id); t.style.whiteSpace = "normal"; t.style.maxWidth = "260px"; tr.appendChild(t);
      tr.appendChild(td(g.email || ("访客 " + (g.ip || "?"))));
      $("ingestTbl").tBodies[0].appendChild(tr);
    }, $("ingestTbl").tBodies[0], 5, "(暂无检索入库记录)");
  }

  // —— 投稿审核 ——
  function renderSubs() {
    var pending = allSubs.filter(function (s) { return s.status === "pending"; }).length;
    $("subPending").textContent = pending + " 待审";
    $("subPending").className = "pill" + (pending > 0 ? " on" : "");
    $("navSubN").textContent = String(pending);
    $("navSubN").className = "badge" + (pending > 0 ? " hot" : "");
    var list = st.subs.status ? allSubs.filter(function (s) { return s.status === st.subs.status; }) : allSubs;
    $("subCount").textContent = "共 " + list.length + " 条";
    paginate(list, st.subs, $("subPager"), function (s) {
      var p = s.payload || {};
      var tr = document.createElement("tr");
      tr.appendChild(td(bj(s.created_at, true), "mono"));
      var t = td(p.title); t.style.whiteSpace = "normal"; t.style.maxWidth = "220px"; t.title = p.summary || ""; tr.appendChild(t);
      tr.appendChild(td(p.category));
      tr.appendChild(td(p.org));
      var lk = document.createElement("td");
      if (p.url) {
        var a = document.createElement("a"); a.href = p.url; a.target = "_blank"; a.rel = "noopener";
        a.textContent = "打开"; a.style.color = "#7aa7ff"; lk.appendChild(a);
      } else {
        lk.textContent = "来源:" + (p.source_note || "—"); lk.className = "muted";
        lk.style.whiteSpace = "normal"; lk.style.maxWidth = "160px";
      }
      if (p.cover) {   // 封面缩略图(待审时直接看)
        var im = document.createElement("img"); im.src = p.cover;
        im.style.cssText = "display:block;max-height:36px;border-radius:4px;margin-top:4px";
        lk.appendChild(im);
      }
      tr.appendChild(lk);
      var mod = s.mod || {};
      var modTxt = (mod.verdict || "—") + (mod.ai && mod.ai.category ? " · " + mod.ai.category : "") +
                   (mod.hits && mod.hits.soft && mod.hits.soft.length ? " · 词:" + mod.hits.soft.join(",").slice(0, 30) : "");
      var mc = td(modTxt, mod.verdict === "pass" ? "" : "muted"); mc.title = (mod.ai && mod.ai.reason) || ""; tr.appendChild(mc);
      tr.appendChild(td(s.email));
      var stc = document.createElement("td");
      var pill = document.createElement("span");
      pill.className = "pill" + (s.status === "approved" ? " on" : "");
      pill.textContent = { pending: "待审", approved: "已通过", rejected: "已拒绝" }[s.status] || s.status;
      stc.appendChild(pill); tr.appendChild(stc);
      var ops = document.createElement("td");
      if (s.status === "pending") {
        ["approve", "reject"].forEach(function (act) {
          var b = document.createElement("button");
          b.textContent = act === "approve" ? "通过" : "拒绝";
          b.style.cssText = "margin-right:6px;padding:3px 10px;border-radius:6px;border:none;cursor:pointer;background:" +
            (act === "approve" ? "#1d3a24;color:#7ee08a" : "#3a1d1d;color:#ff9a8a");
          b.addEventListener("click", function () {
            if (!confirm((act === "approve" ? "通过并发布" : "拒绝") + ":" + p.title + "?")) return;
            post("/api/admin/submissions/decide", { id: s.id, action: act }).then(function (r) {
              if (!r.ok) { alert(r.data && r.data.error || "操作失败"); return; }
              refreshSubs();
            });
          });
          ops.appendChild(b);
        });
      } else ops.textContent = "—";
      tr.appendChild(ops);
      $("subTbl").tBodies[0].appendChild(tr);
    }, $("subTbl").tBodies[0], 9, "(暂无投稿)");
  }
  $("subFilter").addEventListener("click", function (e) {
    var c = e.target.closest(".fchip"); if (!c) return;
    st.subs.status = c.getAttribute("data-st"); st.subs.page = 1;
    var chips = this.querySelectorAll(".fchip");
    for (var i = 0; i < chips.length; i++) chips[i].classList.toggle("is-active", chips[i] === c);
    renderSubs();
  });

  // —— 作品审核(8.3) ——
  var allWorks = [];
  function renderWorks() {
    var pending = allWorks.filter(function (w) { return w.status === "pending"; }).length;
    $("workPending").textContent = pending + " 待审";
    $("workPending").className = "pill" + (pending > 0 ? " on" : "");
    var list = st.works.status ? allWorks.filter(function (w) { return w.status === st.works.status; }) : allWorks;
    $("workCount").textContent = "共 " + list.length + " 条";
    paginate(list, st.works, $("workPager"), function (w) {
      var tr = document.createElement("tr");
      tr.appendChild(td(bj(w.created_at, true), "mono"));
      // 预览:前 3 张缩略图,点开新窗看大图(走管理员图片通道,待审图也能看)
      var pv = document.createElement("td");
      w.images.slice(0, 3).forEach(function (_, i) {
        var a = document.createElement("a");
        a.href = "/api/admin/works/img?id=" + w.id + "&i=" + i; a.target = "_blank"; a.rel = "noopener";
        var im = document.createElement("img"); im.src = a.href;
        im.style.cssText = "height:44px;border-radius:4px;margin-right:4px;vertical-align:middle";
        a.appendChild(im); pv.appendChild(a);
      });
      if (!w.images.length) pv.textContent = "—";
      tr.appendChild(pv);
      var t = td(w.title); t.style.whiteSpace = "normal"; t.style.maxWidth = "220px"; t.title = w.description || ""; tr.appendChild(t);
      tr.appendChild(td(w.images.length, "mono"));
      tr.appendChild(td(w.email || w.uid));
      var mod = w.mod || {};
      var mc = td((mod.verdict || "—") + (mod.ai && mod.ai.category ? " · " + mod.ai.category : ""), mod.verdict === "pass" ? "" : "muted");
      mc.title = (mod.ai && mod.ai.reason) || ""; tr.appendChild(mc);
      tr.appendChild(td(w.reports || 0, w.reports > 0 ? "" : "muted"));
      var stc = document.createElement("td");
      var pill = document.createElement("span");
      pill.className = "pill" + (w.status === "approved" ? " on" : "");
      pill.textContent = { pending: "待审", approved: "已通过", rejected: "已拒绝" }[w.status] || w.status;
      stc.appendChild(pill); tr.appendChild(stc);
      var ops = document.createElement("td");
      function opBtn(label, act, confirmText, bg, fg) {
        var b = document.createElement("button");
        b.textContent = label;
        b.style.cssText = "margin-right:6px;padding:3px 10px;border-radius:6px;border:none;cursor:pointer;background:" + bg + ";color:" + fg;
        b.addEventListener("click", function () {
          if (!confirm(confirmText + ":" + w.title + "?")) return;
          post("/api/admin/works/decide", { id: w.id, action: act }).then(function (r) {
            if (!r.ok) { alert(r.data && r.data.error || "操作失败"); return; }
            refreshWorks();
          });
        });
        ops.appendChild(b);
      }
      if (w.status === "pending") {
        opBtn("通过", "approve", "通过并公开", "#1d3a24", "#7ee08a");
        opBtn("拒绝", "reject", "拒绝(图片将删除)", "#3a1d1d", "#ff9a8a");
      } else if (w.status === "approved") {
        // AI 自动通过的也在这里:人工复核发现问题可随时下架(图片撤回非公开目录留证)
        opBtn("下架", "reject", "下架(从作品频道撤下,图片留证)", "#3a2a1d", "#ffc38a");
      } else ops.textContent = "—";
      tr.appendChild(ops);
      $("workTbl").tBodies[0].appendChild(tr);
    }, $("workTbl").tBodies[0], 9, "(暂无作品)");
  }
  $("workFilter").addEventListener("click", function (e) {
    var c = e.target.closest(".fchip"); if (!c) return;
    st.works.status = c.getAttribute("data-st"); st.works.page = 1;
    var chips = this.querySelectorAll(".fchip");
    for (var i = 0; i < chips.length; i++) chips[i].classList.toggle("is-active", chips[i] === c);
    renderWorks();
  });
  function refreshWorks() {
    get("/api/admin/works").then(function (r) {
      allWorks = r.list || [];
      var pending = allWorks.filter(function (w) { return w.status === "pending"; }).length;
      $("navWorkN").textContent = String(pending);
      $("navWorkN").className = "badge" + (pending > 0 ? " hot" : "");
      if (view === "works") renderWorks();
    }).catch(function () {});
  }

  // —— 数据刷新:导航角标每次都更新;表格只重渲当前模块(保留页码,不打断操作) ——
  function refreshSubs() {
    get("/api/admin/submissions").then(function (r) {
      allSubs = r.list || [];
      var pending = allSubs.filter(function (s) { return s.status === "pending"; }).length;
      $("navSubN").textContent = String(pending);
      $("navSubN").className = "badge" + (pending > 0 ? " hot" : "");
      if (view === "subs") renderSubs();
    }).catch(function () {});
  }
  function refreshContent() {
    get("/api/admin/content").then(function (r) {
      allContent = r.list || [];
      $("navContentN").textContent = String(allContent.length);
      if (view === "content") renderContent();
    }).catch(function () {});
    get("/api/admin/recycle").then(function (r) {
      allRecycle = r.list || [];
      $("navRecycleN").textContent = String(allRecycle.length);
      if (view === "recycle") renderRecycle();
    }).catch(function () {});
    get("/api/admin/ingests").then(function (r) {
      allIngests = r.list || [];
      if (view === "ingest") renderIngests();
    }).catch(function () {});
  }
  function refresh() {
    $("now").textContent = bjClock() + " 北京时间";
    get("/api/admin/overview").then(function (o) {
      renderCards(o); renderOnline(o.online_users); renderEvents(o.recent || []);
    }).catch(function () { location.reload(); });
    get("/api/admin/users").then(function (r) {
      allUsers = r.users || [];
      $("navUserN").textContent = String(allUsers.length);
      if (view === "users") renderUsers();
    }).catch(function () {});
    refreshSubs();
    refreshWorks();
    refreshContent();
  }
})();
</script>
</body>
</html>
